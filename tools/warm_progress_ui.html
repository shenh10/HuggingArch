<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
title: Warm progress
<style>
:root{color-scheme:dark;--bg:#0b1120;--card:#111b2e;--line:#253248;--text:#e7edf6;--muted:#8fa1bd;--amber:#e8a33d;--blue:#62a7ff;--green:#61d5a1;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.metric{font-size:26px;font-weight:700}
.small{color:var(--muted);font-size:12px}
.gpu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:20px}
.bar{height:12px;background:#1d2a41;border-radius:999px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c36b)}
.bar.blue span{background:linear-gradient(90deg,var(--blue),#a8ccff)}
.bar.green span{background:linear-gradient(90deg,var(--green),#b8f0d5)}
.row{display:flex;justify-content:space-between;gap:12px}.row+.row{margin-top:3px}
.time-bars{margin:8px 0 18px}.time{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:10px;margin:7px 0}
.time .bar{margin:0}.time .bar span{background:var(--blue)}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}.num{text-align:right}
.events{margin-top:20px}.event{display:grid;grid-template-columns:80px 120px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.event span:first-child{color:var(--muted)}
@media(max-width:720px){header{display:block}.tables{grid-template-columns:1fr}.event{grid-template-columns:70px 1fr}.event span:nth-child(3){grid-column:1/-1}}
</style>
</head>
<body><div class="wrap">
<header><div><h1>Warm progress</h1><div id="sub" class="sub">Waiting for timing events…</div></div><div id="updated" class="sub"></div></header>
<section id="overall" class="grid"></section>
<section><h2>Time distribution</h2><div id="time" class="time-bars"></div></section>
<section><h2>GPUs</h2><div id="gpus" class="gpu-grid"></div></section>
<section class="tables"><div class="card"><h2>Slowest models</h2><div id="models"></div></div><div class="card"><h2>Slowest layouts</h2><div id="layouts"></div></div></section>
<section class="events card"><h2>Recent events</h2><div id="events"></div></section>
</div>
<script>
const fmt=(n,d=0)=>n==null?"—":Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
const sec=n=>n==null?"—":n>=3600?`${(n/3600).toFixed(1)}h`:n>=60?`${(n/60).toFixed(1)}m`:`${n.toFixed(1)}s`;
const pct=(a,b)=>!b?0:Math.min(100,100*a/b);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function metric(label,value,note=""){return `<div class="card"><div class="small">${label}</div><div class="metric">${value}</div><div class="small">${note}</div></div>`}
function bars(done,total,label,cls=""){return `<div><div class="row"><span class="small">${label}</span><span class="small">${fmt(done)} / ${fmt(total)} · ${fmt(pct(done,total),1)}%</span></div><div class="bar ${cls}"><span style="width:${pct(done,total)}%"></span></div></div>`}
function render(d){
 const o=d.overall;document.getElementById("overall").innerHTML=[metric("Models done",fmt(o.models)),metric("Layouts done",fmt(o.layouts)),metric("Projections",fmt(o.projections)),metric("Sweeps",fmt(o.sweeps)),metric("Events",fmt(d.event_count)),metric("Warm",d.warm_end?sec(d.warm_end.elapsed_s):"running")].join("");
 const total=o.read_s+o.layout_compute_s+o.projection_s+o.sweep_s||1;
 document.getElementById("time").innerHTML=[["Read",o.read_s],["Layout compute",o.layout_compute_s],["Projection",o.projection_s],["Sweep",o.sweep_s]].map(([n,v])=>`<div class="time"><span class="small">${n}</span><div class="bar"><span style="width:${100*v/total}%"></span></div><span class="small num">${sec(v)}</span></div>`).join("");
 document.getElementById("gpus").innerHTML=d.gpus.map(g=>`<article class="card"><div class="row"><strong>${esc(g.gpu)}</strong><span class="small">${g.done?"done":"running"}</span></div>${bars(g.models,g.total_models,"Models","blue")}${bars(g.layouts,g.total_layouts,"Layouts")}<div class="row"><span class="small">elapsed</span><span>${sec(g.elapsed_s)}</span></div><div class="row"><span class="small">ETA</span><span>${g.done?"—":sec(g.eta_s)}</span></div><div class="row"><span class="small">reads</span><span>${fmt(g.reads)} · ${sec(g.read_s)} · p50 ${sec(g.read_p50_s)}</span></div><div class="row"><span class="small">layout compute</span><span>${fmt(g.layout_computes)} · ${sec(g.layout_compute_s)} · p50 ${sec(g.layout_compute_p50_s)}</span></div><div class="row"><span class="small">projections</span><span>${fmt(g.projections)} · ${sec(g.projection_s)} · p50 ${sec(g.projection_p50_s)}</span></div><div class="row"><span class="small">sweeps</span><span>${fmt(g.sweeps)} · ${sec(g.sweep_s)}</span></div></article>`).join("")||`<div class="card">No GPU events yet.</div>`;
 document.getElementById("models").innerHTML=`<table><tr><th>Model</th><th class="num">layouts</th><th class="num">compute</th><th class="num">projections</th></tr>${d.top_models.map(m=>`<tr><td>${esc(m.model)}</td><td class="num">${fmt(m.layouts)}</td><td class="num">${sec(m.layout_compute_s)}</td><td class="num">${fmt(m.projections)}</td></tr>`).join("")}</table>`;
 document.getElementById("layouts").innerHTML=`<table><tr><th>Model</th><th>GPU</th><th class="num">#</th><th class="num">wall</th></tr>${d.top_layouts.map(l=>`<tr><td>${esc(l.model_id)}</td><td>${esc(l.gpu)}</td><td class="num">${fmt(l.layout_index)}</td><td class="num">${sec(l.elapsed_s)}</td></tr>`).join("")}</table>`;
 document.getElementById("events").innerHTML=d.recent_events.slice().reverse().map(e=>`<div class="event"><span>${new Date(e.time*1000).toLocaleTimeString()}</span><span>${esc(e.event)}</span><span>${esc(e.model_id||e.model||e.gpu||"")}${e.elapsed_s!=null?` · ${sec(e.elapsed_s)}`:""}</span></div>`).join("");
 const engine=d.warm_start?.engine;document.getElementById("sub").textContent=engine?`engine ${engine} · ${fmt(d.warm_start?.workers)} workers`:"Waiting for warm_start";
 document.getElementById("updated").textContent=`updated ${new Date().toLocaleTimeString()}`;
}
async function tick(){try{const r=await fetch("/api/progress");render(await r.json())}catch(e){document.getElementById("updated").textContent="offline"}}
tick();setInterval(tick,2000);
</script>
</body></html>
