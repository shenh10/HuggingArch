# HuggingArch on a self-hosted Apple Silicon Mac (Docker Desktop), the
# replacement for Fly. Same image as Fly (../../Dockerfile, built natively for
# linux/arm64); this file holds only what is this host's: the volume, the
# host sizing, the edge (a Cloudflare Tunnel) and the machine id.
# Host-independent runtime configuration lives in the image, shared with
# fly.toml. Secrets are in ~/.config/huggingarch/mac.env, outside every
# checkout (template: env.example); deploy.sh passes it as HA_ENV_FILE.
# Steps: README.md.
name: huggingarch

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        HA_GIT_SHA: ${HA_GIT_SHA:-}
        # The runtime pulls the engine's published SOL / gallery / sweep
        # artifacts at start, so the build-time warm is skipped by default.
        HA_SKIP_WARM: ${HA_SKIP_WARM:-1}
    image: huggingarch:local
    restart: unless-stopped
    env_file: ${HA_ENV_FILE:?run through deploy.sh, or set HA_ENV_FILE}
    environment:
      # The edge: cloudflared overwrites CF-Connecting-IP and
      # X-Forwarded-Proto, and the app is reachable only through it (the
      # port below is loopback-only), so those headers are trusted.
      HA_TRUST_PROXY_HEADERS: "1"
      HA_CLIENT_IP_HEADER: CF-Connecting-IP
      # This machine's id: the Kernel Bench lake's lease and the spec
      # worker's machine identity. Set HA_MACHINE in the env file.
      BENCH_LAKE_MACHINE: ${HA_MACHINE:?set HA_MACHINE in the env file}
      HA_MACHINE_ID: ${HA_MACHINE}
      # While Fly holds the lake's lease this copy is restored from the
      # backup and serves read-only (no writes, no backups). Set
      # BENCH_LAKE_LEASE=on in the env file only after the lease is transferred
      # (README.md, "Cutover").
      BENCH_LAKE_LEASE: ${BENCH_LAKE_LEASE:-off}
      # Host sizing: the same budget as Fly's 8 GB VM (fly.toml explains
      # each). Give Docker Desktop at least 10 GB before raising these.
      HA_SWEEP_POOL_WORKERS: "2"
      HA_WARM_WORKERS: "1"
      HA_LANDING_WARM: "off"
      HA_RUNTIME_WARM: "off"
      SPEC_AGENT_MAX_CONCURRENT: "3"
      BENCH_LAKE_MEMORY_LIMIT: 1536MB
      HA_GALLERY_CACHE_BYTES: 2GiB
      HA_SOL_POOL_PIN_BYTES: 192MiB
    volumes:
      - cache:/app/.cache
    ports:
      - "127.0.0.1:8000:8000"   # local checks only; the public path is the tunnel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    stop_grace_period: 60s

  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      # A remotely-managed tunnel; its public hostname routes to http://app:8000.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in the env file}
    depends_on:
      - app

volumes:
  cache:
