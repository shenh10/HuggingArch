# The release gate of every main commit. The self-hosted host deploys a main
# commit only after this workflow's `release-gate` check run concluded
# `success` on it: its deployer (deploy/self-hosted/deployer/autodeploy.py)
# pulls main and reads that check run itself — nothing here reaches the host,
# and no repository secret names it. (Fly is retired: fly.toml stays only as
# a rollback.)
#
# The gate: the full suite must have passed on this commit in the `tests`
# workflow (the push runs it; the gate waits for it, and refuses a red,
# cancelled or missing run), and a few-minute smoke subset must pass here.
# The full suite is not run twice. A commit marked `[emergency-deploy]`
# skips the wait for the full suite.

name: release gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: >-
          Pass the gate without waiting for the full suite (dispatched on
          main, the host then deploys main's head). Emergency releases only:
          the smoke subset below still runs, and the push-side full suite
          remains required for a green main commit.
        type: boolean
        default: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    # Bounded by the wait for this commit's `tests` run (90 minutes) plus
    # the smoke subset.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      # The full suite runs on every push to main and on a dispatch that
      # asks for a deploy (test.yml); this commit ships only if that run
      # passed. A push's run registers moments after this workflow starts,
      # so a run not found yet is waited for, not treated as absent.
      - name: The tests workflow passed on this commit
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[emergency-deploy]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml \
                    --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url \
                    --jq '.[0] // empty')
            if [ -z "$run" ]; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::no tests run appeared for $GITHUB_SHA within 15 minutes"; exit 1
              fi
              echo "no tests run yet for $GITHUB_SHA — waiting for it to register"; sleep 30
              continue
            fi
            status=$(jq -r .status <<<"$run"); conclusion=$(jq -r .conclusion <<<"$run")
            url=$(jq -r .url <<<"$run")
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then echo "tests passed: $url"; exit 0; fi
              echo "::error::tests $conclusion on $GITHUB_SHA: $url"; exit 1
            fi
            echo "tests $status: $url — waiting"; sleep 60
          done
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # The whole repository, one spelling in all three workflows (see
      # `test.yml`): a gate that measured only `backend/` left
      # `kernel_bench/`, `tools/` and `scripts/` unchecked.
      - run: uv run ruff check .
      # What a release must do on its own: the web app builds, the shared
      # `web/src` modules still behave as their contract tests say, the
      # service layer stays out of the core, the app answers its root,
      # health and cache headers, and the estimate, model-list and agent
      # endpoints answer. A few minutes; the full suite is the tests run
      # above.
      #
      # The unit-test line is here and not only in `test.yml` because this
      # list is the release's own gate: `test_web_unit_tests.py` fails rather
      # than skips when the Node toolchain is missing under `CI`, so a
      # release cannot go out with the shared modules unchecked.
      - run: |
          uv run pytest \
            tests/frontend/test_web_build.py \
            tests/frontend/test_web_unit_tests.py \
            tests/meta/test_service_layout.py \
            tests/backend/api/test_react_root.py \
            tests/backend/api/test_health_drain.py \
            tests/backend/api/test_cache_headers.py \
            tests/backend/api/test_inference_api.py \
            tests/backend/api/test_supported_models_api.py \
            tests/backend/api/test_agent_backends.py \
            -n auto --dist loadfile --timeout=600 -q --tb=short
