name: pool diagnostic

# Runtime diagnostics do not ship code and are ignored by deploy.yml.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Machine status and logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl status -a huggingarch || true
          flyctl machines list -a huggingarch || true
          flyctl machine status 811d5e2c504e18 -a huggingarch || true
          flyctl logs --no-tail -a huggingarch 2>&1 | tee status-logs.txt || true
          grep -iE 'restart|exhaust|entrypoint|Traceback|error|panic|oom|killed|health|machine|SOL pool|gallery cache|warm' status-logs.txt | tail -400 || true
      - name: Inspect persistent release caches
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console -a huggingarch -C "sh -lc '
            echo SOL_MANIFESTS=\$(find /app/.cache/huggingarch/sol-pool -name manifest.json 2>/dev/null | wc -l)
            echo SOL_BOOTSTRAP
            cat /app/.cache/huggingarch/sol-pool/.bootstrap.json 2>/dev/null || true
            echo GALLERY_FACTS=\$(find /app/.cache/huggingarch/gallery-cache -maxdepth 1 -name \"*.json\" 2>/dev/null | wc -l)
            echo GALLERY_FRONTIER=\$(find /app/.cache/huggingarch/gallery-cache/frontier -name \"*.json.gz\" 2>/dev/null | wc -l)
            echo GALLERY_VIEWS=\$(find /app/.cache/huggingarch/gallery-cache/frontier-views -name \"*.json\" 2>/dev/null | wc -l)
            echo GALLERY_BOOTSTRAP
            cat /app/.cache/huggingarch/gallery-cache/.bootstrap.json 2>/dev/null || true
            echo ENV
            env | grep -E \"^(HA_(SOL_POOL|GALLERY_CACHE|ARTIFACT|RUNTIME_WARM|LANDING_WARM)|FLY_APP_NAME)\" | sort
            echo PROCESSES
            for p in /proc/[0-9]*; do test -r \"\$p/cmdline\" || continue; cmd=\$(tr \"\\000\" \" \" < \"\$p/cmdline\"); case \"\$cmd\" in *python*) stat=\$(cat \"\$p/stat\"); echo \"\$p \$stat \$cmd\";; esac; done
            echo LOCAL_HEALTH
            python -c \"import urllib.request; print(urllib.request.urlopen(\\\"http://127.0.0.1:8000/health\\\", timeout=10).read().decode()[:2000])\" || true
            exit 0'"
      - name: Recent logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl logs --no-tail -a huggingarch 2>&1 | tee logs.txt
          grep -iE 'SOL pool artifact|gallery cache artifact|warm pid|landing|Traceback|error|health|OOM|killed' logs.txt | tail -300 || true
