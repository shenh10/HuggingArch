# The named precision profiles: the quick fills of a precision panel.
# Each is an ordinary profile body (`arch/precision_profile.py`),
# canonicalised at load like any request's. `as_shipped` (no rules) is
# every model as it ships.
presets:
  as_shipped:
    label: As shipped
    description: Every weight, edge and cache slot as the model ships it.
    profile: {}
  kv_fp8:
    label: KV FP8
    description: Per-token cache slots in FP8 with a per-tensor scale; states keep their own dtype.
    profile:
      cache:
        - select: { slots: [kv, latent, rope_key, index_key, compressed_kv] }
          format: fp8_per_tensor
  kv_nvfp4:
    label: KV NVFP4
    description: Per-token cache slots in NVFP4 (E2M1, an E4M3 scale per 16); states keep their own dtype.
    profile:
      cache:
        - select: { slots: [kv, latent, rope_key, index_key, compressed_kv] }
          format: nvfp4
  w_fp8_kv_fp8:
    label: Weights FP8 + KV FP8
    description: Attention, dense and MoE matrices in block-128 FP8; KV FP8.
    profile:
      weights:
        - select: { roles: weight_class }
          format: { scheme: fp8 }
      cache:
        - select: { slots: [kv, latent, rope_key, index_key, compressed_kv] }
          format: fp8_per_tensor
  w_nvfp4_w4a4_kv_fp8:
    label: Weights NVFP4 W4A4 + KV FP8
    description: Attention, dense and MoE matrices in NVFP4 with NVFP4 activations (FP4 MMA; needs a GPU with an FP4 peak); KV FP8.
    profile:
      weights:
        - select: { roles: weight_class }
          format: { scheme: nvfp4, activation: w4a4 }
      cache:
        - select: { slots: [kv, latent, rope_key, index_key, compressed_kv] }
          format: fp8_per_tensor
  # msModelSlim's W8A8 export quantises the FFN and leaves attention alone.
  # That is the shape of the real checkpoints (GLM-5.3-Flash-W8A8: every one
  # of its 100 tensor-path patterns carries exactly one label, and the
  # boundary falls on the role), so this preset states the same two rules
  # the export's own `quant_model_description.json` does.
  #
  # The first rule is not redundant: a model shipping quantised attention
  # (GLM-5.3-Flash ships block-FP8 MLA) keeps it unless a rule says
  # otherwise, and a W8A8 export does not ship it — it dequantises to the
  # compute dtype. Most-specific-wins then leaves the two FFN roles INT8.
  #
  # A GLOBAL INT8 preset was removed with this one: selecting
  # `weight_class` turned attention INT8 too, which no msModelSlim export
  # does, and grafted a cast in front of each attention linear. It answered
  # "what would full W8A8 cost" while reading like "what this export costs".
  w_int8_w8a8_ffn:
    label: FFN INT8 W8A8 (msModelSlim mixed)
    description: The FFN — dense and MoE matrices — in msModelSlim W8A8_DYNAMIC (INT8 per channel) with INT8 per-token activations; attention, router and norms in BF16, as the export leaves them. Needs a card with an INT8 peak.
    profile:
      weights:
        - select: { roles: weight_class }
          format: { dtype: bf16 }
        - select: { roles: [ffn_dense, ffn_moe] }
          format: { scheme: modelslim-w8a8-dynamic, activation: w8a8 }
