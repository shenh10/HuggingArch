# MLA + DSA sparse attention — SHARED-indexer variant, multimodal RoPE (Hy4-VL).
# Used by the Hy4 layers whose `indexer_types` entry == "shared" (all layers
# except idx==0 and (idx-1)%4==0) and by the DFly2 draft layers (own no
# indexer; read the target layers' top-K).
#
# Library `mla_dsa_gated_sink_attention_shared` with exactly one change: the
# text rope of hy_v4_vl is multimodal — rope_parameters carries mrope_section
# [12, 10, 10] (HYV4VLRotaryEmbedding, modeling_hy_v4_vl.py:1112-1133), so the
# rotations are `op: mrope` (3 position streams) instead of `op: rope` /
# `op: rope_emb`. The library component hardcodes `rope` and declares no
# `params: { rope: ... }` slot, so it cannot be bound from the spec — this
# draft exists for that difference alone. The decode-time absorbed form stays
# the library's (mla_dsa_gated_sink_attention_shared_absorbed).
#
# Original header (structure unchanged):
#
# These layers run the full MLA QKV path and attend SPARSELY (top-K read), but
# own NO indexer weights: HYV4VLTextModel.forward:1208-1219 threads
# `prev_topk_indices` from the nearest earlier "full" layer, reused via the
# `dsa_topk` stream. So this is `mla_dsa_gated_sink_mrope_attention` minus the
# whole indexer subgraph — no `indexer.*` nodes, no `indexer_logits`, no local
# `dsa_topk_mask`, and no indexer key cache entry. The reused top-K feeds the
# score directly: the source builds index_mask from `prev_topk_indices` and
# masks the attention (modeling_hy_v4_vl.py:398-413), so `qk_score` takes the
# `dsa_topk` stream as its third input (same operand slot the full variant
# fills with dsa_topk_mask).
#
# The Hy4-specific extras of the full variant are kept: sigmoid output gate
# (`self_attn.linear_gate`, gated_mla=true) and per-head learnable sinks
# (`self_attn.learnable_sink_param`, learnable_sink=true) — both exist on every
# attention layer regardless of indexer kind.
#
# Cache (REFERENCE DISAGREEMENT, as the full variant): serving caches the
# d_kv_lora MLA latent and the shared RoPE key, absorbing kv_b_proj into q/o
# at decode; HF's eager path materializes expanded per-head K/V. The cache is
# the latent (`kv_a_layernorm`) + `k_pe_rope`, the prefill graph expands it
# through kv_b_proj, decode reads it absorbed (`decode_variant`).
#
# Required dims: d_model, n_heads, d_qk_nope, d_qk_rope, d_v_head, d_kv_lora,
#                d_q_lora, n_topk_keys (index_topk)

role: attention
description: "MLA + DSA sparse attention, shared indexer (reuses a full layer's top-K via dsa_topk), Hy4 sigmoid output gate + learnable per-head sinks, multimodal (mrope) rotations. MLA latent KV cache. Hy4-VL shared-indexer and DFly2 draft layers."
attn_variant: DSA
cache:
  family: MLA
  entries:
    - { node: kv_a_layernorm, kind: latent }
    - { node: k_pe_rope, kind: rope_key }
decode_variant: mla_dsa_gated_sink_attention_shared_absorbed
# A query reads its top-k rows of the cached latent, so serving prefills
# it absorbed too, through the sparse MLA kernel decode uses.
variant_phases: [prefill, decode]
# Consumes the top-K selected by the nearest earlier full-indexer layer,
# threaded across the stack as the `dsa_topk` stream; `qk_score` consumes it as
# its third input.
reads: [dsa_topk]

graph:
  # --- sigmoid output gate (gated_mla), computed from the block input ---
  linear_gate:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_v_head" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  # --- MLA Q/KV path (identical to the full variant) ---
  q_a_proj:             { op: linear, in: x, dims: { in: d_model, out: d_q_lora }, weight_axes: [{ replicated: true }, { replicated: true }] }
  q_a_layernorm:        { op: rmsnorm, in: q_a_proj, dim: d_q_lora, weight_axes: [{ replicated: true }] }
  q_b_proj:             { op: linear, in: q_a_layernorm, dims: { in: d_q_lora, out: "n_heads * (d_qk_nope + d_qk_rope)" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:        { op: head_split, in: q_b_proj, dims: { n_heads: n_heads, d_head: "d_qk_nope + d_qk_rope" } }
  q_nope_slice:         { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_nope, start: "0" } }
  q_pe_slice:           { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_rope, start: d_qk_nope } }
  kv_a_proj_with_mqa:   { op: linear, in: x, dims: { in: d_model, out: "d_kv_lora + d_qk_rope" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  kv_latent_slice:      { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_kv_lora, start: "0" } }
  k_pe_slice:           { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_qk_rope, start: d_kv_lora } }
  kv_a_layernorm:       { op: rmsnorm, in: kv_latent_slice, dim: d_kv_lora, weight_axes: [{ replicated: true }] }
  kv_b_proj:            { op: linear, in: kv_a_layernorm, dims: { in: d_kv_lora, out: "n_heads * (d_qk_nope + d_v_head)" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  kv_split_heads:       { op: head_split, in: kv_b_proj, dims: { n_heads: n_heads, d_head: "d_qk_nope + d_v_head" } }
  k_nope_slice:         { op: slice, in: kv_split_heads, dims: { in: "d_qk_nope + d_v_head", out: d_qk_nope, start: "0" } }
  value_slice:          { op: slice, in: kv_split_heads, dims: { in: "d_qk_nope + d_v_head", out: d_v_head, start: d_qk_nope } }
  # Multimodal rope: 3 position streams (t, h, w) with mrope_section
  # [12, 10, 10] over the d_qk_rope=64-wide rotary slice
  # (modeling_hy_v4_vl.py:1090, :1124-1133).
  q_pe_rope:            { op: mrope, in: q_pe_slice, dim: d_qk_rope }
  k_pe_rope:            { op: mrope, in: k_pe_slice, dim: d_qk_rope }
  query_concat:         { op: concat, in: [q_nope_slice, q_pe_rope], dims: { in_a: d_qk_nope, in_b: d_qk_rope, out: "d_qk_nope + d_qk_rope" } }
  # k_pe is single-head; fan it out to all heads before the concat.
  k_pe_split:           { op: head_broadcast, in: k_pe_rope, dims: { n_heads: n_heads } }
  k_split_heads:        { op: concat, in: [k_nope_slice, k_pe_split], dims: { in_a: d_qk_nope, in_b: d_qk_rope, out: "d_qk_nope + d_qk_rope" } }
  # --- sparse attention over K/V expanded from the cached latent, reusing the shared top-K ---
  qk_score:             { op: dsa_attention_score, in: [query_concat, k_split_heads, dsa_topk], dims: { n_heads: n_heads, d_head: "d_qk_nope + d_qk_rope", k: n_topk_keys } }
  learnable_sink_param: { op: parameter_vector, dim: n_heads, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }] }
  # Same softmax-with-sink as the full variant (sinks live on self_attn,
  # independent of the indexer): sink logit joins the sparse score row's
  # normalization (modeling_hy_v4_vl.py:240-249); `dsa_softmax` costs the
  # n_topk_keys-sparse row, as in the full variant.
  softmax:              { op: dsa_softmax, in: [qk_score, learnable_sink_param], dims: { n_heads: n_heads, k: n_topk_keys } }
  attn_apply:           { op: dsa_attention_apply, in: [softmax, value_slice], dims: { n_heads: n_heads, d_head: d_v_head, k: n_topk_keys } }
  o_merge_heads:        { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_v_head } }
  g_act:                { op: sigmoid, in: linear_gate, dim: "n_heads * d_v_head" }
  o_gated:              { op: mul, in: [o_merge_heads, g_act], dim: "n_heads * d_v_head" }
  o_proj:               { op: linear, in: o_gated, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
