  # MoE routers: one moe_gating_top_k (aclnnMoeGatingTopK) does the norm,
  # the (grouped) top-k, the gather and the renormalisation, both phases.
  moe_topk_softmax:
    source_anchor: "AscendFusedTopKRouter._compute_routing, norm_type 0 (vllm_ascend/ops/fused_moe/router/fused_topk_router.py:140-241) -> DeviceOperator.moe_gating_top_k (vllm_ascend/device/device_op.py:257-284)"
  moe_topk_sigmoid:
    source_anchor: "AscendFusedTopKRouter._compute_routing, norm_type 1, group_count 1 (vllm_ascend/ops/fused_moe/router/fused_topk_router.py:156-158, vllm_ascend/ops/fused_moe/router/fused_topk_router.py:224-239) -> one aclnnMoeGatingTopK (csrc/moe/moe_gating_top_k/op_host/moe_gating_top_k_tiling.cpp:559-560)"
  moe_fused_gate:
    source_anchor: "AscendFusedTopKRouter._compute_routing with group_select_mode=1 (vllm_ascend/ops/fused_moe/router/fused_topk_router.py:227-239) -> one aclnnMoeGatingTopK, grouped top2-sum selection (csrc/moe/moe_gating_top_k/op_kernel/moe_gating_top_k_generalized.h:285)"

  # Gated DeltaNet gates: one Triton launch for g and beta over the whole
  # batch, both phases. beta is written at the input dtype while the plan
  # bills fp32 — an over-statement of bytes, left as is.
  # The hyper-connection seam, both halves, one launch each. GLM-5.3-Flash
  # is the one model here that has it.
  #
  # `mhc_pre` takes the WHOLE pre-mix, the Sinkhorn split included — which
  # is where this binding differs from the CUDA ones. There the split stays
  # a billed node between `mhc_pre_gemm` and `mhc_pre_big_fuse`
  # (`fusion_plans/mhc_pre_big_fuse.yaml` states that residual); here the
  # kernel does all of it, and the profiler agrees: one `HcPre` per seam,
  # 126.6 us at 1024 tokens against a launch floor near 35, where the
  # seven primitives would be seven launches.
  #
  # The sublayer RMSNorm is NOT absorbed: the plugin calls `npu_rms_norm`
  # on the launch's output (vllm_ascend/models/glm5next/model.py:513) and the trace shows its own
  # `RmsNorm` kernel beside `HcPre`. It stays a node, as the plan does.
  mhc_pre:
    crosses: component
    when:
      architectures: [Glm5NextForConditionalGeneration]
      device: [npu]
    source_anchor: "Glm5NextDecoderLayer.hc_pre -> torch.ops._C_ascend.npu_hc_pre_v2(x, hc_fn, hc_scale, hc_base, n, mhc_sinkhorn_iterations, rms_norm_eps, hc_eps) (vllm_ascend/models/glm5next/model.py:499-507), registered npu_hc_pre_v2_npu -> run_hc_pre_fusion (csrc/torch_binding.cpp:3255-3264); called once per sublayer seam from the layer's forward (vllm_ascend/models/glm5next/model.py:425-446) and through hc_post_pre (vllm_ascend/models/glm5next/model.py:536-545)"
  mhc_post:
    crosses: component
    when:
      architectures: [Glm5NextForConditionalGeneration]
      device: [npu]
    source_anchor: "Glm5NextDecoderLayer.hc_post -> torch.ops._C_ascend.npu_hc_post(x, residual, post, comb) (vllm_ascend/models/glm5next/model.py:523-525), registered npu_hc_post_npu -> EXEC_NPU_CMD(aclnnHcPost) (csrc/torch_binding.cpp:1434); the last layer materialises its own (vllm_ascend/models/glm5next/model.py:484) and every other defers it into the next layer's pre (vllm_ascend/models/glm5next/model.py:536)"

  # DSA's sparse main attention is ONE AscendC launch, not the three ops
  # the naive plan spells it as. `sparse_mla` gathers the top-K KV entries
  # inside the kernel — no score or softmax tensor reaches HBM — so the
  # span is `flash_dsa`'s whole chain, exactly as it is on CUDA.
  # Unbound, the three members priced separately and stayed `unplaced`
  # (`missing_signature`) at 215 ms a step, larger than the attention
  # class they belong to.
  flash_dsa:
    when:
      architectures: [Glm5NextForConditionalGeneration]
      device: [npu]
    source_anchor: "sparse_mla -> torch.ops._C_ascend.npu_sparse_flash_attention(query, key=cache, value=cache, sparse_indices, sparse_mode=3, attention_mode=2) (vllm_ascend/attention/sfa_v1.py:172-245, the call at vllm_ascend/attention/sfa_v1.py:228); the profiler names it SparseFlashAttention"

  fused_gdn_gating:
    source_anchor: "fused_gdn_gating_patch (vllm_ascend/ops/triton/fused_gdn_gating.py:59-99, kernel vllm_ascend/ops/triton/fused_gdn_gating.py:14-56) via DeviceOperator.fused_gdn_gating (vllm_ascend/device/device_op.py:940-942), from AscendGatedDeltaNetAttention._forward_core (vllm_ascend/ops/gdn.py:680)"
