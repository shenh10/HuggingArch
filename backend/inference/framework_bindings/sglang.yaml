  # (`mhc_pre_big_fuse_with_norm_tilelang`, :936); above it the post
  # (`mhc_post_tilelang`, :1311, called at :1759), the pre-norm GEMM
  # (DeepGEMM `tf32_hc_prenorm_gemm` at :1772, else the `gemm_sqrsum`
  # dispatch at :1788) and the big fuse.
  # DeepSeek-V4 reaches it with `use_fused_mhc_post_pre` on
