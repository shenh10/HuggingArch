  # ---- the hyper-connection sublayer boundary (the "mHC seam") ----
  # sglang runs the same boundary as vLLM, two or three launches through
  # `mhc_fused_post_pre` (kernels/ops/layernorm/mhc.py:1631): at most
  # `fma_token_threshold = 32` rows (:1716) it is the fused post + pre-GEMM
