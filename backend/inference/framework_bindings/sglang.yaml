  # (srt/configs/deepseek_v41.py:47), which turns this fused path off
  # (deepseek_v4.py:2804-2806) and takes the shifted schedule
  # (`forward_hc_pre_from_prev`, deepseek_v4.py:3346): each sublayer boundary
  # is the mix stats (`_mix_stats_impl`, srt/models/deepseek_v4_mhc.py:259,
  # behind `mix_stats` :244 — one fused launch for the projection AND the
  # Sinkhorn split at default CUDA row counts, `hc_mix_stats_sinkhorn` /
  # `_bf16x3` / `_deepgemm`, kernels/ops/layernorm/mhc.py:2462/:2622/:2686),
  # the post (`post`, deepseek_v4_mhc.py:452 — TileLang `mhc_post` by
  # default, `mhc_post_split_h` at <= 64 rows on SM90 / <= 384 on Blackwell,
  # :511/:489), and the collapse of the copies by the CARRIED pre with the
  # sublayer norm fused (`hc_combine_norm`,
  # kernels/ops/layernorm/hc_combine_norm.py, from `_combine`,
  # deepseek_v4_mhc.py:394, called at :443; on SM90 the fused form serves
  # only <= 96 or 4096-65536 rows, so at 97-4095 rows sglang runs
  # `hc_combine` and the norm apart — the default path of each phase is
  # billed, per the cost-model doc). The stats launch computes the split this
  # graph keeps as the `hc_split_sinkhorn` node — the same stated residual
  # `mhc_pre_big_fuse` carries, so it stays billed. On Blackwell at
  # 4096-65536 rows `_post_fusion` (deepseek_v4_mhc.py:589) folds the post,
  # the next collapse and the norm into ONE launch
  # (`mhc_post_combine_norm_prefill`, :625-648; at <= 384 rows on Blackwell
  # the post alone is `mhc_post_split_h`, no post+collapse fusion exists
  # there); the H100 default billed here runs them as the two plans below.
  # The stack exit is `hc_combine` with the last carried pre plus the model
  # RMSNorm (deepseek_v4.py:4530-4540) — the same reduce + norm shape as the
  # epilogue, but it sits on the model outside every block occurrence, so
  # the component-crossing pattern cannot reach it and it bills naive; the
