# sglang framework binding — sglang's fusion patterns: which fused-op concepts
# it runs as one launch, and `when:` it does; and the serving choices a
# measured kernel's key depends on that sglang, not the model, makes
# (`kv_block_size`, and where it reads `ssm_chunk_size`); the output widths
# the kernels it dispatches to REQUIRE of a declared role (`edge_dtypes`);
# and which
# all-reduce algorithm it runs on a payload inside one NVLink domain
# (`collectives`). Nothing else lives here; the bytes and the link
# traversals each algorithm costs are `comm_volume.ALGORITHMS`'. Which kernel a fused
# op launches and which release measured it are the measured corpus's
# identity, not this file's.
#
# There is one binding per framework and it describes the latest release it
# was checked against, named by `audited_at`. Every fact and every file:line
# below was read at that tag with `git show <tag>:<path>`. In comments, paths
# are relative to `python/sglang/`; a `source_anchor` writes every place it
# cites from the repository root (`<path>[:<line>[-<line>]]`), and each links
# to `audited_at.commit` on GitHub (`audited_at.repo`). sglang's kernels live
# in one package at this tag: `kernels/ops/**` are the python wrappers,
# `kernels/jit/csrc/**` the JIT sources, `kernels/aot/python/sgl_kernel` the
# AOT wheel.
#
# Ordering: the loader sorts `op_implementations` by pattern size so larger
# patterns match first; yaml order only breaks ties. Where two patterns share
# nodes the larger is the launch sglang takes when its condition holds
# (`fused_qk_norm_rope` over `fused_q_kv_rmsnorm`'s norm pair).

framework: sglang
audited_at:
  repo: sgl-project/sglang
  tag: v0.5.22
  commit: baa9befa381511cd4d56f83980951e5a45fffc6d

# Each entry: a fused-op concept (`fusion_plans/`) sglang runs as one launch,
# where its source says so, and `when:` it does (absent: whenever the pattern
# matches).
# The paged-KV page sglang allocates the cache in: it declares none.
# `arg_groups/fields/schedule.py` has `page_size: A[Optional[int], Arg(
# help="The number of tokens in a page.", resolvable=True)] = None` —
# resolved per attention backend at startup, not fixed by the server.
# So there is no default to state here, and a request that wants its
# measured rows keyed by a page has to name one. `null` is the
# declaration; omitting the key is rejected at load.
kv_block_size: null

# Where sglang reads the chunk length it hands
# `mamba_chunk_scan_combined(chunk_size=...)` for a Mamba-2 mixer
# (`FrameworkBinding.ssm_chunk_size_from`): the checkpoint config, first field
# present wins. The Mamba-2 backend reads `mamba_chunk_size`
# (`srt/layers/attention/hybrid_linear_attn_backend.py:112`), and each model's
# config class fills it from the checkpoint's `mamba_chunk_size`, else its
# `chunk_size` (`srt/configs/nemotron_h.py:224` _resolve_mamba_chunk_size;
# `srt/configs/mamba2.py:34` aliases `chunk_size`). The value is resolved
# once per deployment's walk (`Program.scan_chunk_size`).
# sglang's own fallbacks when neither is set (the config class's 256, the
# backend's 64) are not taken here — a checkpoint that states neither has no
# scan cell.
ssm_chunk_size:
  from_config: [mamba_chunk_size, chunk_size]

# The width a kernel sglang dispatches to REQUIRES a declared role's output at,
# where that is not the width the checkpoint implies (vllm.yaml states how
# these are read). A role named by no entry carries no such requirement and
# keeps its stored width.
#
# DeepSeek-V4's router: the gate weight ships BF16, and the hash top-k kernel
# downstream takes fp32 logits and nothing else — `MoEHashTopKParams` declares
# `const float* router_logits`. `MoEGate.forward` meets that on every CUDA path
# it takes: the tiny-token GEMM passes `out_dtype=torch.float32`, and the
# general path calls `linear_bf16_fp32`, a cuBLAS "bf16 x bf16 -> fp32" GEMM.
# Both paths are the same requirement, so neither phase is a separate entry.
#
# SCOPE, and why it is a boundary rather than a gap: `MoEGate` is sglang's gate
# for the whole DeepSeek-V2/V3/V4 and GLM MoE family, and it writes fp32 for
# all of them. Only the V4 classes appear here because only there does a kernel
# REQUIRE fp32 — build the V4 logits BF16 and the harness times the fallback
# kernel under a name promising the dsv4 one. The grouped V3/GLM top-k accepts
# either width under both frameworks, so there is no requirement to declare,
# and writing fp32 where bf16 would do is a framework inefficiency we do not
# follow: those cells keep the width they build (`refs._moe_gate_inputs`).
edge_dtypes:
  deepseek_v4_router_logits_fp32:
    roles: [router]
    dtype: F32
    when: {device: [cuda],
           architectures: [DeepseekV4ForCausalLM, DeepseekV41ForCausalLM]}
    source_anchor: "MoEGate.forward writes fp32 logits on CUDA (python/sglang/srt/models/deepseek_v2.py:550), through the tiny-token GEMM's out_dtype (python/sglang/srt/models/deepseek_v2.py:573-576) or the general cuBLAS bf16 x bf16 -> fp32 path (python/sglang/srt/models/deepseek_v2.py:584-587), the gate itself declared at python/sglang/srt/models/deepseek_v2.py:491; the hash top-k kernel takes those logits as float (python/sglang/kernels/jit/csrc/deepseek_v4/hash_topk.cuh:24-29)"

# The all-reduce sglang runs on a tensor-parallel payload inside one NVLink
# domain, by payload (vllm.yaml states how the rungs are read). One
# representative threshold per algorithm; sglang's per-(capability, world)
# tables, its CUDA-graph vs eager split and its environment switches are
# billed as below, not modelled.
#
# The path. On CUDA the JIT custom all-reduce v2 is the default
# (srt/distributed/device_communicators/custom_all_reduce.py:344-369,
# `SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2` on, srt/environ.py:1388), picked
# before NCCL (srt/distributed/parallel_state.py:957-1001). It takes one-shot
# (push or pull), then a multicast two-shot over the payloads its table
# names, then a two-shot (custom_all_reduce_v2.py:335-347). At TP8 under a
# CUDA graph — a decode step — SM90 takes one-shot to 128 KiB, multicast
# two-shot from 512 KiB (configs/custom_all_reduce_v2.py:274-277) and SM100
# one-shot to 512 KiB, multicast two-shot from 8 MiB (:160-164). The
# 1 MiB-over-the-group rung is SM90's 128 KiB at TP8 exactly and bills SM100's
# 512 KiB with it; FlashInfer's MNNVL AUTO, which the architectures sglang
# turns AR+RMSNorm fusion on for run on Blackwell
# (srt/arg_groups/overrides.py:905-960), switches at the same 1 MiB.
#
# Group sizes. The v2 kernel takes the world sizes its table has: 2-8 on
# SM90, 2-8 and 16 on SM100 (configs/custom_all_reduce_v2.py:129-170,
# 242-277), refusing any other (custom_all_reduce_v2.py:486-488) — a 32- or
# 72-rank NVL72 group runs NCCL. Multicast needs 4 ranks on SM90
# (configs/custom_all_reduce_v2.py:240) and a table entry on SM100 (:118,
# 5-8 and 16), one NVLS rung each; SM100 at 2-4 ranks runs two-shot to
# 128 MiB (:130-144).
#
# FlashInfer AR fusion. For the architectures sglang auto-enables it for
# (srt/arg_groups/overrides.py:905-960) on SM100, FlashInfer's MNNVL backend
# (srt/layers/flashinfer_comm_fusion.py:58-68) takes the all-reduce before
# the custom kernel (srt/distributed/parallel_state.py:788-789): AUTO's
# one-shot to 1 MiB over the group, two-shot past it — no NVLS. The rung has
# no cap because the source sets none: the fused norm grows the workspace to
# the step's tokens (`max_token_num=max(x.shape[0], 2048)`,
# srt/layers/layernorm.py:246). Its other conditions (no attention DP,
# `moe_a2a_backend` none, one node or SM100) are billed as the default
# deployment.
#
# Billed, not modelled: the eager tables of a prefill step (one-shot to
# 128 KiB / 750 KiB, multicast two-shot from the smallest payload; at 4
# ranks on SM100 two-shot only to 32 MiB, configs/custom_all_reduce_v2.py:
# 140-144, billed by the graph table's 128 MiB;
# configs/custom_all_reduce_v2.py:160-164, 274-277); FlashInfer's TRT-LLM
# backend on SM90 for the fusion architectures, whose one-shot reaches
# further; PCIe groups, billed as NCCL's; sequence parallelism's custom
# all-gather and reduce-scatter, not the default serving path, billed as
# NCCL's. Across NVLink domains sglang runs NCCL, priced as the hierarchical
# schedule.
collectives:
  all_reduce:
    - algorithm: one_shot
      max_bytes_times_world: 1048576
      worlds: [2, 3, 4, 5, 6, 7, 8, 16]
      source_anchor: "group sizes of the v2 tables (python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:129-170, python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:242-277), others refused at python/sglang/srt/distributed/device_communicators/custom_all_reduce_v2.py:486-488; CustomAllReduceV2 one-shot thresholds (python/sglang/srt/distributed/device_communicators/custom_all_reduce_v2.py:335-347, python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:274-277)"
    - algorithm: two_shot
      when:
        min_compute_capability: "10.0"
        architectures: [DeepseekV3ForCausalLM, DeepseekV32ForCausalLM, DeepseekV4ForCausalLM, GptOssForCausalLM, GlmMoeDsaForCausalLM, Glm4MoeForCausalLM, Glm4MoeLiteForCausalLM, MistralLarge3ForCausalLM, Qwen3MoeForCausalLM, Qwen3VLMoeForConditionalGeneration, Qwen3NextForCausalLM, Qwen4ExpForConditionalGeneration, KimiK25ForConditionalGeneration, Qwen3_5MoeForConditionalGeneration, InternS2PreviewForConditionalGeneration, Qwen3_5ForConditionalGeneration, NemotronHForCausalLM, NemotronHPuzzleForCausalLM, NemotronH_Omni_Reasoning_V3]
      worlds: [2, 3, 4, 5, 6, 7, 8, 16]
      source_anchor: "FlashInfer AR fusion auto-enabled for these architectures on SM100 (python/sglang/srt/arg_groups/overrides.py:905-960), MNNVL backend (python/sglang/srt/layers/flashinfer_comm_fusion.py:58-68), taken before the custom all-reduce (python/sglang/srt/distributed/parallel_state.py:788-789): AUTO's two-shot past 1 MiB, the same switch as the one-shot rung's; group sizes billed as the v2 kernel's"
    - algorithm: two_shot
      max_bytes: 134217728
      when: { min_compute_capability: "10.0" }
      worlds: [2, 3, 4]
      source_anchor: "SM100's graph tables at 2-4 ranks: no multicast, two-shot to 128 MiB (python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:118, python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:130-144)"
    - algorithm: two_shot
      max_bytes: 8388608
      when: { min_compute_capability: "10.0" }
      worlds: [2, 3, 4, 5, 6, 7, 8, 16]
      source_anchor: "SM100's TP8 graph table, multicast two-shot from 8 MiB (python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:160-164)"
    - algorithm: two_shot
      max_bytes: 524288
      worlds: [2, 3, 4, 5, 6, 7, 8, 16]
      source_anchor: "SM90's TP8 graph table, multicast two-shot from 512 KiB (python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:274-277)"
    - algorithm: nvls
      when: { below_compute_capability: "10.0" }
      worlds: [4, 5, 6, 7, 8]
      source_anchor: "SM90 multicast from 4 ranks (python/sglang/srt/distributed/device_communicators/configs/custom_all_reduce_v2.py:240); CustomAllReduceV2's multicast two-shot (python/sglang/srt/distributed/device_communicators/custom_all_reduce_v2.py:343-344)"
    - algorithm: nvls
      when: { min_compute_capability: "10.0" }
      worlds: [5, 6, 7, 8, 16]
      source_anchor: "CustomAllReduceV2's multicast two-shot (python/sglang/srt/distributed/device_communicators/custom_all_reduce_v2.py:343-344), multimem.ld_reduce / multimem.st at python/sglang/kernels/jit/csrc/distributed/custom_all_reduce.cuh:123-127"

# Checkpoint scale layouts this framework's model loader transforms. The model
# spec declares the layout; this binding owns the framework behavior and its
# audited source.
weight_loaders:
  mimo_v2_fused_qkv:
    kind: tp_interleaved
    loader: whole_chunks
    when: { architectures: [MiMoV2ForCausalLM] }
    source_anchor: "sglang loads whole interleaved chunks and merges them at lower TP (python/sglang/srt/models/mimo_v2.py:101-158), refusing a runtime attention TP that does not divide the checkpoint degree (python/sglang/srt/models/mimo_v2.py:118-122); at lower TP it dequantizes, de-interleaves Q/K/V and requantizes (python/sglang/srt/models/mimo_v2.py:193-289); the fused layer skips the generic block check (python/sglang/srt/models/mimo_v2.py:653), and the checkpoint degree comes from the fused-qkv KV-head count (python/sglang/srt/configs/model_config.py:117-145)"

op_implementations:
  # The FA3 backend (srt/layers/attention/flashattention_backend.py:132), the
  # Hopper default for MHA and MLA (srt/arg_groups/model_override_base.py:297-303,
  # :326-328).
  flash_attention:
    source_anchor: "sglang.srt.layers.attention.flashattention_backend.FlashAttentionBackend (python/sglang/srt/layers/attention/flashattention_backend.py:132)"
  # `SiluAndMul.forward_cuda` (srt/layers/activation.py:145-150) → the
  # module-level `silu_and_mul` (:98-99), JIT or AOT by vector width (:85-96).
  silu_and_mul:
    source_anchor: "sglang.srt.layers.activation.SiluAndMul.forward_cuda (python/sglang/srt/layers/activation.py:145-150 -> python/sglang/srt/layers/activation.py:98-99)"
  gelu_and_mul:
    source_anchor: "sglang.srt.layers.activation.GeluAndMul._forward_impl (python/sglang/srt/layers/activation.py:228-238)"
  # Kimi-K3's SituGLU: `SituAndMul.forward_cuda` (activation.py:209-212) → the
  # JIT kernel kernels/ops/activation/_jit_situ_and_mul.py:36; `KimiK3MLP`
  # builds it (models/kimi_k3.py:330-334) — the dense layer's MLP (:2558) and
  # the shared expert (:623), i.e. outside the dispatch zone only (`routed:
  # false`). The routed experts never reach SituAndMul: their SiTU is the MoE
  # runner's. With the shipped MXFP4 checkpoint the experts go to
  # `Mxfp4MoEMethod` (models/kimi_k3.py:484-497). On SM90 the runner backend
  # stays `auto` (the Kimi-K3 override only picks `flashinfer_mxfp4` on
  # SM100/103/107, arg_groups/model_overrides/kimi_k3.py:188-205), which
  # resolves to the Triton runner (layers/quantization/mxfp4.py:1443-1450),
  # and its SiTU is eager torch over fp32 copies of gate and up
  # (layers/moe/moe_runner/triton_utils/fused_moe.py:808-818) — about a dozen
  # launches, no single one to bind, so the routed act is billed as its two
  # nodes. On SM100 trtllm-gen applies SiTU inside the expert GEMM
  # (`_fused_experts_flashinfer_mxfp4_sm100_trtllm_gen`,
  # moe_runner/flashinfer_trtllm.py:1063, activation_type Situ :1178); with no whole-expert plan
  # bound, that site too stays its two nodes, two launches more than sglang
  # runs. The DeepGEMM runner's fused SiTU + FP8 quant
  # (moe_runner/deep_gemm.py:471-500, masked :808-810) needs the DeepGEMM
  # backend (an explicit flag or a DeepEP a2a) and, for these FP4 experts,
  # SM100 — not the default path.
  situ_and_mul:
    source_anchor: "sglang.srt.layers.activation.SituAndMul.forward_cuda (python/sglang/srt/layers/activation.py:209-212), from KimiK3MLP (python/sglang/srt/models/kimi_k3.py:330-334)"
    when:
      routed: false
  # DeepSeek-V4 clamped SwiGLU (kernels/ops/moe/dsv4.py:186), from
  # `DeepseekV2MLP.forward` (srt/models/deepseek_v2.py:484) when
  # `swiglu_limit` is set.
  silu_and_mul_with_clamp:
    source_anchor: "sglang.kernels.ops.moe.dsv4.silu_and_mul_clamp (python/sglang/kernels/ops/moe/dsv4.py:186), from DeepseekV2MLP.forward (python/sglang/srt/models/deepseek_v2.py:484)"
  # The short conv in front of every SSM / linear-attention mixer, SiLU
  # folded in — the same `causal_conv1d_fn` / `causal_conv1d_update` pair
  # (srt/layers/attention/linear/gdn_backend.py:930, :856). It takes no
  # dilation: Qwen PLE's dilated conv is `F.conv1d` then `F.silu`
  # (srt/models/qwen4_exp.py:1136, :1151).
  causal_conv1d:
    source_anchor: "sglang.srt.layers.attention.linear.gdn_backend (causal_conv1d_fn python/sglang/srt/layers/attention/linear/gdn_backend.py:930, causal_conv1d_update python/sglang/srt/layers/attention/linear/gdn_backend.py:856)"
    when:
      dims: { dilation: [1] }
  # The linear-attention output norm gated by silu/sigmoid(z) in one Triton
  # launch (kernels/ops/attention/fla/layernorm_gated.py:488, kernel :75; from
  # srt/models/qwen3_5.py:503).
  rmsnorm_gated:
    source_anchor: "sglang.kernels.ops.attention.fla.layernorm_gated.RMSNorm (python/sglang/kernels/ops/attention/fla/layernorm_gated.py:488)"
  # Mamba-2's grouped gated RMSNorm (gate before norm) in one FLA launch
  # (srt/layers/attention/mamba/mixer2_rms_norm_gated.py:120 ->
  # kernels/ops/attention/fla/layernorm_gated.py:355) while TP divides
  # n_groups (:130-131; otherwise forward_native all-gathers x and runs
  # torch ops). Its tp_size is the attention TP group under DP-attention,
  # else the global TP group (:29-35) — the walk's `tp_attention` world.
  mamba2_rmsnorm_gated:
    source_anchor: "sglang.srt.layers.attention.mamba.mixer2_rms_norm_gated.Mixer2RMSNormGated.forward_cuda (python/sglang/srt/layers/attention/mamba/mixer2_rms_norm_gated.py:120) -> fla.layernorm_gated.rms_norm_gated (python/sglang/kernels/ops/attention/fla/layernorm_gated.py:355)"
    when:
      world_local: { world: tp_attention, dim: n_ssm_groups, divides: true }
  # Gated DeltaNet prefill gates: g and beta in one Triton launch, written
  # fp32 (kernels/ops/attention/fla/fused_gdn_gating.py:44, :57-58), from
  # srt/layers/attention/linear/gdn_backend.py:1166 via _prefill_gates :947;
  # the q/k l2norms stay inside chunk_gated_delta_rule (fla/chunk.py:107-131).
  # CUDA: the CPU kernel stores beta at b's dtype.
  fused_gdn_gating:
    source_anchor: "sglang.kernels.ops.attention.fla.fused_gdn_gating.fused_gdn_gating (python/sglang/kernels/ops/attention/fla/fused_gdn_gating.py:44), from python/sglang/srt/layers/attention/linear/gdn_backend.py:1166 via _prefill_gates python/sglang/srt/layers/attention/linear/gdn_backend.py:947"
    when:
      phase: [prefill]
      device: [cuda]
  # Gated DeltaNet decode: l2norm + gates + recurrence as one launch
  # (kernels/ops/attention/fla/fused_recurrent.py:269, from
  # srt/layers/attention/linear/gdn_backend.py:868 via
  # linear/kernels/gdn_triton.py:121). Prefill fuses only the gate chain
  # (`fused_gdn_gating` below), whose two fp32 outputs the plan states per
  # port.
  # The decode entry is the default decode backend's, Triton
  # (`linear_attn_decode_backend` unset; the backend falls back to
  # `linear_attn_backend`, default "triton", fields/exec_.py:480-493).
  # FlashInfer GDN decode is
  # chosen only by server arguments: `--linear-attn-decode-backend
  # flashinfer`, or on SM100 the hook's own default, which requires the
  # server argument `--mamba-ssm-dtype bfloat16` (arg_groups/
  # attention_hook.py:287-302 reads the server argument, default None
  # (fields/exec_.py:428-434), not the checkpoint's mamba_ssm_dtype; nothing
  # else sets it except --enable-linear-replayssm-spec, which sets float32,
  # :505-515). No deployment this repository describes sets either
  # argument, so every one runs the Triton path audited here.
  fused_recurrent_gated_delta_rule:
    source_anchor: "sglang.kernels.ops.attention.fla.fused_recurrent.fused_recurrent_gated_delta_rule_packed_decode (python/sglang/kernels/ops/attention/fla/fused_recurrent.py:269), from python/sglang/srt/layers/attention/linear/gdn_backend.py:868"
    when:
      phase: [decode]
  # KDA prefill gates (both KDA classes): the bounded forget gate
  # lower_bound * sigmoid((f + dt_bias) * exp(A_log)) and beta = sigmoid(b)
  # in one Triton launch, both written fp32 and the gate already
  # chunk-cumsummed — the form the chunk kernels read
  # (kernels/ops/attention/fla/kda.py:1059, kernel
  # kda_gate_chunk_cumsum_vector_kernel :947; fp32 :1066, :1112), called
  # from `chunk_kda_fwd` (:1178) when `A_log` is given, in place of the
  # plain chunk-local cumsum (:1191-1201). Reached from `forward_extend`
  # (kda_backend.py:1126, `beta_is_raw=True`) via
  # `KDAKernelDispatcher.extend` (:414-428) and `TritonKDAKernel.extend`
  # (linear/kernels/kda_triton.py:237); the prefill-graph path hands the
  # same arguments (kda_prefill_graph.py:353-365), and both models hand the
  # raw gate (srt/models/kimi_k3.py:2119-2123). Triton is the default
  # prefill backend (`--linear-attn-backend` default "triton",
  # fields/exec_.py:480; `--linear-attn-prefill-backend` unset, :494). The
  # q/k l2norms stay two launches inside the chunk path
  # (fla/kda.py:1299-1301). `architectures`: GLM-5.3-Flash's and Kimi-K3's
  # classes are the corpus's two KDA spellings, and vLLM's prefill is
  # FlashKDA — one launch whose workspace writes no plan states — so this
  # entry is sglang's alone.
  fused_kda_gate:
    source_anchor: "sglang.kernels.ops.attention.fla.kda.kda_gate_chunk_cumsum (python/sglang/kernels/ops/attention/fla/kda.py:1059), from python/sglang/srt/layers/attention/linear/kda_backend.py:1126 via chunk_kda python/sglang/kernels/ops/attention/fla/kda.py:1274"
    when:
      phase: [prefill]
      device: [cuda]
      architectures: [Glm5NextForConditionalGeneration, KimiK3ForConditionalGeneration]
  # KDA decode (GLM-5.3-Flash): gate + beta + q/k l2norm + recurrence in one
  # Triton launch (srt/layers/attention/linear/kernels/kda_triton.py:141 ->
  # kernels/ops/attention/fla/fused_sigmoid_gating_recurrent.py, from
  # kda_backend.py:981). Kimi-K3's per-channel gate has its own entries
  # below (`fused_kda_decode`, `fused_recurrent_kda_per_channel`).
  fused_recurrent_kda:
    source_anchor: "sglang.kernels.ops.attention.fla.fused_sigmoid_gating_recurrent.fused_sigmoid_gating_delta_rule_update(is_kda=True), from python/sglang/srt/layers/attention/linear/kda_backend.py:981 via python/sglang/srt/layers/attention/linear/kernels/kda_triton.py:141"
    when:
      phase: [decode]
      architectures: [Glm5NextForConditionalGeneration]
  # Kimi-K3 KDA decode, plain (non-speculative) steps. The whole mixer is
  # one JIT launch, `kda_fused_decode` (kernels/ops/attention/
