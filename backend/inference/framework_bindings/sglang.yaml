    source_anchor: "sglang.kernels.ops.layernorm.mhc.mhc_fused_post_pre (python/sglang/kernels/ops/layernorm/mhc.py:1631), small-token path mhc_fused_post_pre_fma_tilelang (python/sglang/kernels/ops/layernorm/mhc.py:1391)"
