# vLLM framework binding — vLLM's fusion patterns: which fused-op concepts it
# runs as one launch, and `when:` it does; the serving choices a measured
# kernel's key depends on that vLLM, not the model, makes (`kv_block_size`,
# and where it reads `ssm_chunk_size`); which launch it selects for a
# quantised matmul (`precision_launches`); the output widths the kernels it
# dispatches to REQUIRE of a declared role (`edge_dtypes`); and which
# all-reduce algorithm it runs on a payload inside one NVLink domain
# (`collectives`). Nothing else lives
# here: framework source is a reference for an implementation, a fusion
# pattern, a measured kernel's identity and that dispatch; the bytes and the
# link traversals each algorithm costs are `comm_volume.ALGORITHMS`'.
# Which release measured a dispatch, and at what latency, is the corpus row's
# provenance (`framework_version`, date, contributor). Which provider
# implementation vLLM dispatches to is declared below in `kernel_dispatches`,
# with the provider library and the provider's COMPLETE resolved
# `kernel_impl` id.
#
# There is one binding per framework and it describes the latest release it
# was checked against, named by `audited_at`. Every fact and every file:line
# below was read at that tag with `git show <tag>:<path>`. In comments, paths
# are relative to `vllm/` unless they start with `csrc/`; a `source_anchor`
# writes every place it cites from the repository root
# (`<path>[:<line>[-<line>]]`), and each links to `audited_at.commit` on
# GitHub (`audited_at.repo`).
#
# Ordering: the loader sorts `op_implementations` by pattern size so larger
# patterns match first; yaml order only breaks ties. Where two patterns share
# nodes the larger is the launch vLLM takes when its condition holds
# (`fused_gdn_post_conv_prep` over `fused_recurrent_gated_delta_rule`'s gate
# chain).
#
# vLLM has no single kernel for a whole SwiGLU FFN: it runs the
# activation-and-mul op with a separate gate+up GEMM and a separate
# `down_proj`, which is why `gated_act_ffn` is not bound. `grouped_gemm_moe`
# and `fused_moe` are not bound while their schemes are single-linear
# placeholders that would overmatch dense linears.

framework: vllm
audited_at:
  repo: vllm-project/vllm
  tag: v0.32.0
  commit: 5df63a7203cdb9328d824a27b682e77c7b9928be

# Each entry: a fused-op concept (`fusion_plans/`) vLLM runs as one launch,
# where its source says so, and `when:` it does (absent: whenever the pattern
# matches).
# One fused-op name may map to a list of these entries when two audited launch
# spans have provably disjoint `when:` conditions. Their provider identities
# still live only in `kernel_dispatches`.
# The paged-KV page vLLM allocates the cache in, its own default
# (`vllm/config/cache.py` CacheConfig.DEFAULT_BLOCK_SIZE = 16). A paged
# attention kernel's time depends on it, so it is part of the measurement
# key; a request may ask for another value and a backend declines the ones
# it cannot serve.
kv_block_size: 16

# Where vLLM reads the chunk length it hands
# `mamba_chunk_scan_combined(chunk_size=...)` for a Mamba-2 mixer
# (`FrameworkBinding.ssm_chunk_size_from`): the checkpoint config, first field
# present wins (`vllm/config/model.py:1664` get_mamba_chunk_size:
# `mamba_chunk_size`, then `chunk_size`). The value is resolved once per
# deployment's walk (`Program.scan_chunk_size`). vLLM's own
# fallback of 2048 when neither is set is for Mamba-1, which has no chunk; it
# is not taken here — a checkpoint that states neither has no scan cell.
ssm_chunk_size:
  from_config: [mamba_chunk_size, chunk_size]

# The launches vLLM may select for a mixed-precision matmul, in the source's
# own preference order for one scheme/request. The first candidate whose
# `mma_dtypes` all have columns on the request's card is the launch taken; a
# card need not be named by an SM family to get that answer. `mma_dtypes`
# says WHICH operand families enter the hardware instruction. It is
# deliberately not inferred from operand width — Humming can run MXFP4
# weights with block-FP8 activations on Hopper by dequantising in software
# before WGMMA (vllm/model_executor/layers/fused_moe/experts/
# fused_humming_moe.py:323-325), while DeepGEMM's Blackwell launch is an FP4
# MMA. A declared launch, not a width, chooses between them.
#
# The first two DeepSeek entries are the audited priority list: TRT-LLM
# MXFP8, then DeepGEMM. The default has no explicit backend fact, so it stops
# at the first card-capable entry (TRT-LLM on B200). DeepGEMM is reachable
# only when a request states `moe_backend=deep_gemm`; without that fact it is
# counted as a skipped selector alternative and the DeepGEMM provider remains
# a gap rather than becoming an unrequested measured row.
#
# The pre-Blackwell entry is the default MXFP4 oracle's input treatment
# (`act_key=None`, BF16), including MiMo's Fp8Config(store_dtype=mxfp4),
# whose Blackwell interpretation is not settled. No Blackwell entry is written
# for MiMo here: its group-32 cell stays a provider gap rather than becoming a
# silently green contract.
#
# gpt-oss's distinct `mxfp4` scheme is deliberately not relabeled as the
# compressed-tensors `mxfp4-pack-quantized` scheme. Its checkpoint declares no
# activation quantizer, and vLLM's GPT-OSS selector filters its priority list
# to BF16-activation variants (`activation_key=None`): CUDA family 100 takes
# TRT-LLM's BF16 variant, while Hopper takes the OAI Triton W4A16 path (with
# other W4A16 fallbacks behind it). It remains a scheme-declared W4A16 row on
# both cards, not the two pack-quantized models'
# Blackwell selector gap.
precision_launches:
  mxfp4_dot_suffix_trtllm_mxfp8:
    schemes: [mxfp4-dot-suffix]
    requested_activation_formats:
      - fp8_token_group128_ue8m0
      - fp8_token_group32_ue8m0
    when:
      device: [cuda]
      server_flag: {name: moe_backend, default: auto, value: auto}
    launch:
      activation: fp8_token_group32_ue8m0
      compute_dtype: F8_E4M3
      mma_dtypes: [F8_E4M3, MXFP4]
    source_anchor: "vLLM's DeepSeek auto selector iterates its priority list and puts FlashInfer TRT-LLM before DeepGEMM (vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:754-807, vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:425-449); that backend eats kMxfp8Dynamic, FP8 E4M3 with a group-32 UE8M0 scale (vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:452-462, vllm/model_executor/layers/quantization/utils/quant_utils.py:249-252); on CUDA family 100 with FlashInfer it accepts the MXFP4/MXFP8 pair, SILU and Standard activation format, and the modular fallback accepts the parallel/routing deployment (vllm/model_executor/layers/fused_moe/experts/trtllm_mxfp4_moe.py:117-155, vllm/model_executor/layers/fused_moe/experts/trtllm_mxfp4_moe.py:300-314); the CUDA build pins FlashInfer (requirements/cuda.txt:13)"
  mxfp4_dot_suffix_deepgemm_group128:
    schemes: [mxfp4-dot-suffix]
    requested_activation_formats: [fp8_token_group128_ue8m0]
    when:
      device: [cuda]
      server_flag: {name: moe_backend, default: auto, value: deep_gemm}
    launch:
      activation: fp8_token_group128_ue8m0
      compute_dtype: F8_E4M3
      mma_dtypes: [F8_E4M3, MXFP4]
    source_anchor: "An explicit vLLM moe_backend is honoured before the auto priority list, and deep_gemm maps to DeepGEMM's MXFP4 backend (vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:754-783, vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:341-355); that backend's activation key is FP8 dynamic group 128 (vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:452-462), and DeepGemmFP4Experts calls m_grouped_fp8_fp4_gemm_nt_contiguous with FP8 activations and MXFP4 weights in blocks of 128 and 32 (vllm/model_executor/layers/fused_moe/experts/deep_gemm_moe.py:447-479, vllm/model_executor/layers/fused_moe/experts/deep_gemm_moe.py:650-680)"
  mxfp4_dot_suffix_weight_only:
    schemes: [mxfp4-dot-suffix]
    requested_activation_formats:
      - fp8_token_group128_ue8m0
      - fp8_token_group32_ue8m0
    when: {device: [cuda]}
    launch:
      activation: none
      compute_dtype: BF16
      mma_dtypes: [BF16]
    source_anchor: "The default MXFP4 oracle hands Marlin, Humming and Triton no activation key, so their input is BF16 (vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:425-448, vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:468-471); Humming is promoted at SM90 (vllm/model_executor/layers/quantization/utils/humming/priority.py:11, vllm/model_executor/layers/quantization/utils/humming/priority.py:26-48)"
  mxfp4_pack_quantized_weight_only:
    schemes: [mxfp4-pack-quantized]
    when: {device: [cuda], below_compute_capability: "10.0"}
    launch:
      activation: none
      compute_dtype: BF16
      mma_dtypes: [BF16]
    source_anchor: "The default MXFP4 oracle hands Marlin, Humming and Triton no activation key, so their input is BF16 (vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:425-448, vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:468-471); Humming is promoted at SM90 (vllm/model_executor/layers/quantization/utils/humming/priority.py:11, vllm/model_executor/layers/quantization/utils/humming/priority.py:26-48)"
  # gpt-oss's own `mxfp4` scheme has no activation request by default.  This
  # narrower coordinate is deliberately reachable only when a checkpoint (or a
  # deployment activation declaration resolved onto that checkpoint scheme)
  # requests block-FP8 group-128.  It therefore cannot change any current
  # corpus model's default route.  The explicit backend fact is part of the
  # audit: `moe_backend=humming` maps to this Humming candidate instead of
  # guessing from a kernel or scheme name.
  mxfp4_humming_hopper_w4a8_ladder:
    schemes: [mxfp4]
    requested_activation_formats: [fp8_token_group128_ue8m0]
    when:
      device: [cuda]
      min_compute_capability: "9.0"
      below_compute_capability: "10.0"
      server_flag: {name: moe_backend, default: auto, value: humming}
    launch:
      activation: fp8_token_group128_ue8m0
      compute_dtype: F8_E4M3
      mma_dtypes: [F8_E4M3, MXFP4]
      promotion_ladder: true
    source_anchor: "vLLM resolves the checkpoint's activation key before honouring an explicit MXFP4 MoE backend, and `moe_backend='humming'` maps exactly to the Humming candidate (vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:598-649, vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:341-367); Humming's supported weight/activation list explicitly contains `(kMxfp4Static, kFp8Dynamic128Sym)` and says that MXFP4 group-32 weights with block-FP8 group-128 activations run through WGMMA software dequantisation on Hopper as well as Blackwell (vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py:318-326)"

# The width a kernel vLLM dispatches to REQUIRES a declared role's output at,
# where that is not the width the checkpoint implies
# (`FrameworkBinding.edge_dtypes`). A role named by no entry carries no such
# requirement and keeps its stored width — this states the requirements, not a
# table of every edge, and not every place a framework happens to write wide:
# where the kernel takes either width we build the cell's, because we model the
# better form rather than mirror a framework's inefficiency. Each anchor cites
# both the write and the requirement, and the loader refuses one that cites
# fewer than two places.
#
# DeepSeek-V4's router: `ffn.gate.weight` ships BF16 and vLLM loads it BF16,
# so the walk would price BF16 logits. The top-k kernel vLLM then dispatches
# exists only at fp32 — `can_use_dsv4_topk` requires
# `gating_output.dtype == torch.float32` and `fused_topk_bias` falls through to
# another kernel when it fails — and vLLM builds the gate as
# `GateLinear(out_dtype=torch.float32)` to meet it. Keying this span BF16 would
# store an fp32 measurement under a BF16 name, or — if the harness believed the
# key — measure the FALLBACK kernel under a name promising the dsv4 one.
#
# The weight stays BF16: a framework upcasting a stored weight at load is not
# followed (`traffic.weight_promotion`), and the operand the GEMM streams is
# still BF16, so its peak column is BF16 too. Only the OUTPUT is fp32.
#
# DeepSeek-V4.1 inherits it: its `DeepseekV4MoE` subclasses V4's and calls
# `super().__init__`, which builds that same fp32 gate.
edge_dtypes:
  deepseek_v4_router_logits_fp32:
    roles: [router]
    dtype: F32
    when: {architectures: [DeepseekV4ForCausalLM, DeepseekV41ForCausalLM]}
    source_anchor: "DeepseekV4MoE builds its router as GateLinear(out_dtype=torch.float32) (vllm/models/deepseek_v4/nvidia/model.py:724-729, the class at vllm/models/deepseek_v4/nvidia/model.py:661; DeepSeek-V4.1 subclasses it and calls super().__init__ at vllm/models/deepseek_v41/nvidia/model.py:126-143); the kernel that reads those logits takes only fp32, can_use_dsv4_topk (vllm/model_executor/layers/fused_moe/router/dsv4_topk.py:22-24) guarding the dsv4_topk dispatch (vllm/model_executor/layers/fused_moe/router/fused_topk_bias_router.py:179-189)"

# Provider dispatches, first read for Llama-3.2-1B and extended to the Qwen2
# and Qwen3 audits. vLLM is the declaration holder, while `library` names the
# provider that a corpus row measured (often torch).
#
# ONE ENTRY PER OP, listing in `architectures` every class whose module graph
# reaches that anchor. The anchors are shared code — `UnquantizedLinearMethod`,
# `RMSNorm`, `SiluAndMul`, `RotaryEmbedding`, `FlashAttentionImpl` — so an op
# dispatched the same way for three classes is one fact, and writing it once
# per class produced three different answers to it: an fp16 Llama-2 got
# `vllm_rms_norm` where an fp16 Qwen got nothing, and a Qwen on Blackwell lost
# an elementwise kernel that vLLM runs there. A class is on the list when the
# audit walked its module graph to the anchor; the conditions beside it are
# the anchor's, not the class's.
#
# What a `when:` may say is the facts the anchored dispatch itself reads:
#   * `device` — every one of these anchors branches on the platform.
#   * `server_flag` — `--linear-backend` selects FlashInfer's `mm_bf16` over
#     `F.linear` (utils.py:620-632) and `--attention-backend` selects another
#     attention backend entirely, so both are provider identity, not a launch
#     count. (`docs/inference_cost_model.md`'s "deployment choice" row is
#     about a plan's launches; a `kernel_dispatches` entry names an exact
#     `(library, impl_id)` and cannot absorb a different kernel.)
#   * `unquantized_bf16_launch` — only where the anchor selects on the
#     operand: the linear and embedding families dispatch through
#     `Unquantized*Method`, and FlashAttention reads the KV cache dtype
#     (flash_attn.py:296-318, flash_attn.py:432-440). The norm, activation,
#     rotation and add anchors read none of it, so they state none.
#   * `tensor_parallel` — only `embedding`, whose anchor is
#     VocabParallelEmbedding's unsharded path. `F.linear`, `ir.ops.rms_norm`
#     and `torch.ops._C.silu_and_mul` do not read the world.
#   * capability window, `phase`, `kv_block_size` — only FlashAttention,
#     whose version resolution is by capability (fa_utils.py:94-104) and
#     whose decode identity names the page it audited.
#
# The one narrowing that is AUDIT SCOPE rather than a dispatch fact is the
# `bf16` half of `unquantized_bf16_launch`: vLLM selects
# `UnquantizedLinearMethod` because the layer has no `quant_config`, whatever
# its dtype, and `default_unquantized_gemm` never looks at one. The repository
# has no dtype-agnostic "this launch is unquantized" fact, and a proxy for one
# would be worse than the gap, so these entries stay narrower than the
# framework: an fp16 checkpoint of these classes is `no_active` (a missing
# number) rather than wrong.
#
# Billed under the default serving path, with the assumption stated rather
# than a condition key added: FA3 on SM90 is upgraded to FA4 for a head size
# over 256, for ALiBi, and for diff-KV with sinks (fa_utils.py:126-165). Every
# audited class is well inside that, and `head_dim` is not a
# `kernel_dispatches` fact today.
#
# Cards, backends, and parameterised cells outside what is stated here stay
# undeclared rather than being inferred from a row label or a base kernel
# name. `precision_launches` above (and the walk's promoted key) still decides
# launch dtype before these entries are asked; no dispatch condition repeats
# weight dtype, quant scheme, or MMA facts.
kernel_dispatches:
  - op: linear
    library: torch
    impl_id: torch_cublas_linear
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           server_flag: {name: linear_backend, default: auto},
           unquantized_bf16_launch: true, device: [cuda]}
    source_anchor: "An unquantized dense projection runs UnquantizedLinearMethod.apply (vllm/model_executor/layers/linear.py:229-239), whose CUDA dispatch reads the platform and --linear-backend only and returns torch.nn.functional.linear at the audited default auto (vllm/model_executor/layers/utils.py:620-632, vllm/model_executor/layers/utils.py:83-90); the projections are Llama's dense ones, Qwen2Attention's o_proj with Qwen2MLP's down_proj and Qwen2ForCausalLM's ParallelLMHead (vllm/model_executor/models/qwen2.py:166-172, vllm/model_executor/models/qwen2.py:98-104, vllm/model_executor/models/qwen2.py:479-487), and Qwen3Attention's o_proj with Qwen3MLP's imported down_proj and untied lm_head (vllm/model_executor/models/qwen3.py:115-121, vllm/model_executor/models/qwen3.py:219-225, vllm/model_executor/models/qwen3.py:306-314)"
  - op: qkv_parallel_linear
    library: torch
    impl_id: torch_cublas_linear
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           server_flag: {name: linear_backend, default: auto},
           unquantized_bf16_launch: true, device: [cuda]}
    source_anchor: "Each class builds one packed QKVParallelLinear and calls it before splitting q/k/v: LlamaAttention (vllm/model_executor/models/llama.py:160-173, vllm/model_executor/models/llama.py:229-233), Qwen2Attention (vllm/model_executor/models/qwen2.py:157-165, vllm/model_executor/models/qwen2.py:208-214) and Qwen3Attention, which QK-norms after the split (vllm/model_executor/models/qwen3.py:106-114, vllm/model_executor/models/qwen3.py:156-171); UnquantizedLinearMethod.apply selects torch.nn.functional.linear on auto CUDA (vllm/model_executor/layers/linear.py:229-239, vllm/model_executor/layers/utils.py:620-632, vllm/model_executor/layers/utils.py:83-90)"
  - op: merged_column_parallel_linear
    library: torch
    impl_id: torch_cublas_linear
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           server_flag: {name: linear_backend, default: auto},
           unquantized_bf16_launch: true, device: [cuda]}
    source_anchor: "Each MLP merges gate and up into one MergedColumnParallelLinear ahead of SiLU-and-mul: LlamaMLP (vllm/model_executor/models/llama.py:95-121), Qwen2MLP (vllm/model_executor/models/qwen2.py:91-114) and Qwen3MLP, which is Qwen2MLP (vllm/model_executor/models/qwen3.py:58, vllm/model_executor/models/qwen3.py:219-225); UnquantizedLinearMethod.apply selects torch.nn.functional.linear on auto CUDA (vllm/model_executor/layers/linear.py:229-239, vllm/model_executor/layers/utils.py:620-632, vllm/model_executor/layers/utils.py:83-90)"
  - op: embedding
    library: torch
    impl_id: torch_embedding
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           unquantized_bf16_launch: true, device: [cuda], tensor_parallel: [1]}
    source_anchor: "Each model builds VocabParallelEmbedding for embed_tokens: LlamaModel (vllm/model_executor/models/llama.py:377-386), Qwen2Model (vllm/model_executor/models/qwen2.py:371-375, vllm/model_executor/models/qwen2.py:399-400) and Qwen3Model, which inherits that construction (vllm/model_executor/models/qwen3.py:269-277); at TP=1 its UnquantizedEmbeddingMethod.embedding is torch.nn.functional.embedding's index-select floor (vllm/model_executor/layers/vocab_parallel_embedding.py:522-550, vllm/model_executor/layers/vocab_parallel_embedding.py:73-86)"
  - op: add
    library: torch
    impl_id: torch_add
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           device: [cuda]}
    source_anchor: "Each decoder carries its residual activation between sublayers and across layer calls: Llama (vllm/model_executor/models/llama.py:313-330), Qwen2 (vllm/model_executor/models/qwen2.py:427-433, vllm/model_executor/models/qwen2.py:297-310) and Qwen3 (vllm/model_executor/models/qwen3.py:231-250, vllm/model_executor/models/qwen2.py:427-445); an unabsorbed block-boundary add is eager torch tensor addition, while an add feeding the next RMSNorm is the separate fused_add_rmsnorm dispatch below (vllm/model_executor/layers/layernorm.py:74-96)"
  - op: rmsnorm
    library: vllm
    impl_id: vllm_rms_norm
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           device: [cuda]}
    source_anchor: "RMSNorm's forward_cuda/native selects its op on whether a residual was passed and on nothing else — no dtype, no world, no capability (vllm/model_executor/layers/layernorm.py:74-96); without one it lowers to ir.ops.rms_norm. The norms are Llama's decoder and final ones (vllm/model_executor/models/llama.py:308-311, vllm/model_executor/models/llama.py:394-397), Qwen2's (vllm/model_executor/models/qwen2.py:286-289, vllm/model_executor/models/qwen2.py:394-397) and Qwen3's, which adds unconditional per-head q/k norms applied separately (vllm/model_executor/models/qwen3.py:153-170, vllm/model_executor/models/qwen3.py:226-229)"
  - op: fused_add_rmsnorm
    library: vllm
    impl_id: vllm_fused_add_rms_norm
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           device: [cuda]}
    source_anchor: "With residual non-None the same RMSNorm lowers to ir.ops.fused_add_rms_norm (vllm/model_executor/layers/layernorm.py:74-96); every completed decoder layer passes one into its post-attention norm and the model's final norm receives the carried residual — Llama (vllm/model_executor/models/llama.py:313-330), Qwen2 (vllm/model_executor/models/qwen2.py:297-310, vllm/model_executor/models/qwen2.py:445) and Qwen3 (vllm/model_executor/models/qwen3.py:237-250)"
  - op: silu_and_mul
    library: vllm
    impl_id: vllm_silu_and_mul
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           device: [cuda]}
    source_anchor: "SiluAndMul picks its op by platform alone (vllm/model_executor/layers/activation.py:128-150), torch.ops._C.silu_and_mul on CUDA; each MLP requires SiLU and runs it between the merged gate/up and the down projection — LlamaMLP (vllm/model_executor/models/llama.py:112-121), Qwen2MLP (vllm/model_executor/models/qwen2.py:91-114) and Qwen3MLP, which is Qwen2MLP (vllm/model_executor/models/qwen3.py:58, vllm/model_executor/models/qwen3.py:219-225)"
  - op: fused_qk_rope
    library: vllm
    impl_id: vllm_c_rotary_embedding
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           device: [cuda]}
    source_anchor: "RotaryEmbedding.forward_cuda calls ops.rotary_embedding in place (vllm/model_executor/layers/rotary_embedding/base.py:221-247); each attention builds one RotaryEmbedding and rotates q and k together in one call — LlamaAttention (vllm/model_executor/models/llama.py:224-233), Qwen2Attention after the packed split (vllm/model_executor/models/qwen2.py:179-184, vllm/model_executor/models/qwen2.py:208-214, vllm/model_executor/models/qwen2.py:232-234) and Qwen3Attention after QK-norm (vllm/model_executor/models/qwen3.py:123-129, vllm/model_executor/models/qwen3.py:156-171)"
  - op: flash_attention
    library: vllm
    impl_id: vllm_flash_attention_v3
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           server_flag: {name: attention_backend, default: auto},
           unquantized_bf16_launch: true, device: [cuda], phase: [prefill],
           min_compute_capability: "9.0", below_compute_capability: "10.0"}
    source_anchor: "On Hopper vLLM resolves FlashAttention version 3 (vllm/v1/attention/backends/fa_utils.py:94-104) and FlashAttentionImpl's dense path calls its varlen FA kernel with the resolved version (vllm/v1/attention/backends/flash_attn.py:1177-1198, vllm/v1/attention/backends/flash_attn.py:1399-1424); the KV cache dtype is part of that selection, a quantised cache being gated and able to move SM90 to FA4 (vllm/v1/attention/backends/flash_attn.py:432-440, vllm/v1/attention/backends/flash_attn.py:296-318). The decoder attentions are Qwen2Attention's and Qwen3Attention's GQA heads, called after RoPE (vllm/model_executor/models/qwen2.py:185-206, vllm/model_executor/models/qwen2.py:232-234, vllm/model_executor/models/qwen3.py:130-153, vllm/model_executor/models/qwen3.py:156-171) and LlamaAttention's, built with its GQA heads and called after RoPE (vllm/model_executor/models/llama.py:206-222, vllm/model_executor/models/llama.py:229-232)"
  - op: flash_attention
    library: vllm
    impl_id: vllm_flash_attention_v3_kvcache@_b16
    when: {architectures: [LlamaForCausalLM, Qwen2ForCausalLM, Qwen3ForCausalLM],
           server_flag: {name: attention_backend, default: auto},
           unquantized_bf16_launch: true, device: [cuda], phase: [decode],
           min_compute_capability: "9.0", below_compute_capability: "10.0",
           kv_block_size: [16]}
    source_anchor: "The same FA3 resolution (vllm/v1/attention/backends/fa_utils.py:94-104, vllm/v1/attention/backends/flash_attn.py:432-440, vllm/v1/attention/backends/flash_attn.py:296-318); the decode path reads the paged cache through the block table and calls the varlen FA kernel (vllm/v1/attention/backends/flash_attn.py:1177-1305, vllm/v1/attention/backends/flash_attn.py:1399-1424), the audited default cache page is 16 (vllm/config/cache.py:72), and the page is in this identity because the provider resolves it into the impl_id"

# The all-reduce vLLM runs on a tensor-parallel payload inside one NVLink
# domain, by payload: the first rung the card admits and the payload fits
# wins, NCCL's schedule past them all (`comm_cost.collective_ladder`; the
# card's topology is `gpu_specs.csv` `nvlink_gbps` / `nvls`). One
# representative threshold per algorithm, where the estimate changes under
# common deployments; vLLM's per-(capability, world) buffer caps, its
# environment switches and its CUDA-graph details are billed as below, not
# modelled.
#
# The path. At the default `-O2` (config/vllm.py:427) the AR+RMSNorm fusion
# pass is on for TP>1 on SM90 and the SM100 family with flashinfer installed
# (config/vllm.py:171-195, :294), and an all-reduce it does not absorb tries
# FlashInfer first (distributed/device_communicators/cuda_communicator.py:
# 362-396; `VLLM_ALLREDUCE_USE_FLASHINFER` defaults on, envs.py:278). On one
# node FlashInfer runs its MNNVL backend, which needs the NVSwitch multicast
# (flashinfer_all_reduce.py:143-178), and vLLM leaves the one-shot/two-shot
# choice to FlashInfer's AUTO (compilation/passes/fusion/allreduce_rms_fusion.py:
# 158-168). In flashinfer-python 0.7.0.post1 (requirements/cuda.txt:13) AUTO
# takes one-shot when `num_tokens * hidden * world * elem_size <= 1 MiB`
# (flashinfer/comm/trtllm_mnnvl_ar.py:34-51): each rank writes its payload once
# to the multicast address and reduces the N copies it reads back
# (trtllm_mnnvl_allreduce.cuh:916-990), else two-shot, a scatter and a
# multicast broadcast (:1280-1335). Where FlashInfer does not run (a capability
# it has no table for: A100, RTX-4090) vLLM's custom all-reduce does the same
# on fully NVLink-connected GPUs (custom_all_reduce.py:499-514): one stage
# below 256 KiB at 6-8 ranks and 512 KiB at 4, two stages above
# (csrc/custom_all_reduce.cuh:291-310) — the 1 MiB-over-the-group rung bills
# both.
#
# Billed, not modelled: FlashInfer's payload cap is 0.5 MiB at TP8 on SM90,
# 1 MiB on SM100 (allreduce_rms_fusion.py:104-127) — one 1 MiB rung bills
# both. Past it vLLM runs torch symmetric memory's `multimem_all_reduce_`
# (NVLS) at the world sizes it lists (symm_mem.py:26-31, 137-154;
# `VLLM_ALLREDUCE_USE_SYMM_MEM` defaults on, envs.py:277): 4, 6 and 8 on
# Hopper, 6 and 8 on Blackwell, one NVLS rung each; a 4-rank Blackwell group
# runs FlashInfer's two-shot to 32 MiB on SM100 (:110-115) and NCCL past it.
# On SM103 the fused AR+RMSNorm pass caps at 64 MiB at both 4 and 8 ranks
# (:116-121) while the standalone all-reduce's tuned cap is 64 MiB at 8 and
# 80 MiB at 4 (all_reduce_utils.py:85-92): the SM103 rung takes 64 MiB, and a
# 4-rank payload of 64-80 MiB is billed NCCL's — the same bytes, its hops
# apart. A 2-rank
# group runs FlashInfer's two-shot to 64 MiB, which costs what NCCL's ring
# does at 2 ranks. The NVLS rung has no cap: past symmetric memory's
# 64-128 MiB NCCL runs, and is billed NVLS too — an assumption (NCCL picks
# its NVLS algorithm on such a fabric; that choice is not in vLLM's source).
# On SM103 (B300, GB300) a prefill payload thus stays two-shot to 64 MiB
# (flashinfer_all_reduce.py:56-70). Without NVLink (PCIe cards) every all-reduce
# is billed as NCCL's, though vLLM's custom kernel runs a two-GPU PCIe group
# (custom_all_reduce.py:512). Sequence parallelism's custom all-gather and
# reduce-scatter (custom_all_reduce.py:570-660,
# models/common/ops/sequence_parallel.py:24-36) are not the default serving
# path and are billed as NCCL's. Across NVLink domains vLLM runs NCCL
# (FlashInfer refuses a multi-node Hopper group, flashinfer_all_reduce.py:
# 165-175), priced as the hierarchical schedule.
#
# Group sizes — what decides the algorithm, so each rung states it
# (`worlds`). FlashInfer has a table for 2, 4, 8 (and 16 on SM100/SM103)
# ranks and is off for any other (allreduce_rms_fusion.py:104-127,
# flashinfer_all_reduce.py:421-430); the custom all-reduce takes 2, 4, 6, 8
# (custom_all_reduce.py:121, :500); symmetric memory 2, 4, 6, 8
# (all_reduce_utils.py:58-83), multimem at 4, 6, 8 on Hopper and 6, 8 on
# Blackwell (symm_mem.py:26-31). A group of 32 or 72 ranks in one NVL72 rack
# runs none of them: NCCL.
collectives:
  all_reduce:
    - algorithm: one_shot
      max_bytes_times_world: 1048576
      worlds: [2, 4, 6, 8, 16]
      source_anchor: "group sizes: FlashInfer's table (vllm/compilation/passes/fusion/allreduce_rms_fusion.py:104-127, checked at vllm/distributed/device_communicators/flashinfer_all_reduce.py:421-430) and the custom all-reduce's, at most 8 (vllm/distributed/device_communicators/custom_all_reduce.py:121, vllm/distributed/device_communicators/custom_all_reduce.py:500); FlashInfer's MNNVL all-reduce, AUTO strategy (vllm/distributed/device_communicators/flashinfer_all_reduce.py:143-178, vllm/compilation/passes/fusion/allreduce_rms_fusion.py:158-168, flashinfer pinned at requirements/cuda.txt:13); custom 1stage on fully connected GPUs (csrc/custom_all_reduce.cuh:291-310)"
    - algorithm: two_shot
      max_bytes: 67108864
      when: { min_compute_capability: "10.3" }
      worlds: [2, 4, 8, 16]
      source_anchor: "group sizes of FlashInfer's SM103 table (vllm/compilation/passes/fusion/allreduce_rms_fusion.py:116-121); SM103's tuned standalone FlashInfer MNNVL cap (vllm/distributed/device_communicators/all_reduce_utils.py:85-92, vllm/distributed/device_communicators/flashinfer_all_reduce.py:56-70)"
    - algorithm: two_shot
      max_bytes: 1048576
      worlds: [2, 4, 6, 8, 16]
      source_anchor: "group sizes as the one-shot rung's (the custom all-reduce's 2stage at 6, vllm/distributed/device_communicators/custom_all_reduce.py:121); FlashInfer's all-reduce cap by capability and world (vllm/compilation/passes/fusion/allreduce_rms_fusion.py:104-127, vllm/distributed/device_communicators/flashinfer_all_reduce.py:421-449)"
    - algorithm: two_shot
      max_bytes: 33554432
      when: { min_compute_capability: "10.0" }
      worlds: [4]
      source_anchor: "FlashInfer's SM100 4-rank cap, 32 MiB (vllm/compilation/passes/fusion/allreduce_rms_fusion.py:110-115); symmetric memory runs no multimem at 4 ranks on SM100 (vllm/distributed/device_communicators/symm_mem.py:26-31)"
    - algorithm: nvls
      when: { below_compute_capability: "10.0" }
      worlds: [4, 6, 8]
      source_anchor: "group sizes torch symmetric memory runs multimem at on SM90 (vllm/distributed/device_communicators/symm_mem.py:26-31) and has a cap for (vllm/distributed/device_communicators/all_reduce_utils.py:58-83); torch symmetric memory's multimem all-reduce (vllm/distributed/device_communicators/symm_mem.py:137-154), dispatched at vllm/distributed/device_communicators/cuda_communicator.py:427-431"
    - algorithm: nvls
      when: { min_compute_capability: "10.0" }
      worlds: [6, 8]
      source_anchor: "group sizes torch symmetric memory runs multimem at on SM100/SM103 (vllm/distributed/device_communicators/symm_mem.py:26-31) and has a cap for (vllm/distributed/device_communicators/all_reduce_utils.py:58-83); torch symmetric memory's multimem all-reduce (vllm/distributed/device_communicators/symm_mem.py:26-31, vllm/distributed/device_communicators/symm_mem.py:137-154), dispatched at vllm/distributed/device_communicators/cuda_communicator.py:427-431"

# Checkpoint scale layouts this framework's model loader transforms. The model
# spec declares the layout; this binding owns the framework behavior and its
# audited source.
weight_loaders:
  mimo_v2_fused_qkv:
    kind: tp_interleaved
    loader: head_gather
    when: { architectures: [MiMoV2ForCausalLM] }
    source_anchor: "vLLM gathers each rank's Q/K/V heads from checkpoint chunks, replicating KV where needed, then requantizes one rank-local fused grid (vllm/model_executor/models/mimo_v2.py:495-632); requantization pads the final block (vllm/model_executor/models/mimo_v2.py:468-492), and the linear constructor allows the ragged merged FP8 partition (vllm/model_executor/layers/linear.py:540-574)"

op_implementations:
  # V1 FlashAttention backend (v1/attention/backends/flash_attn.py:1052); FA3
  # on SM90 (v1/attention/backends/fa_utils.py:99-101), FA4 on SM100
  # (:102-104). Either is one launch over QK^T + softmax + PV.
  flash_attention:
    source_anchor: "vllm.v1.attention.backends.flash_attn.FlashAttentionImpl (vllm/v1/attention/backends/flash_attn.py:1052)"
  silu_and_mul:
    source_anchor: "vllm.model_executor.layers.activation.SiluAndMul (vllm/model_executor/layers/activation.py:116, torch.ops._C.silu_and_mul at vllm/model_executor/layers/activation.py:138)"
  gelu_and_mul:
    source_anchor: "vllm.model_executor.layers.activation.GeluAndMul (vllm/model_executor/layers/activation.py:411, gelu_and_mul / gelu_tanh_and_mul chosen at vllm/model_executor/layers/activation.py:436-438)"
  # Kimi-K3's SituGLU, one launch at both of its sites. Dense MLP and shared
  # expert: `KimiMLP` builds `SituAndMul` (models/kimi_k3/nvidia/model.py:274-278)
  # → `torch.ops._C.situ_and_mul`. Routed experts: the MXFP4 checkpoint is
  # rerouted to `Mxfp4Config` (model_executor/models/config.py:414-444), whose
  # backend list on CUDA runs SM100's FlashInfer/DeepGEMM kernels, then Humming,
  # then Marlin (fused_moe/oracle/mxfp4.py:425-449; Humming moves ahead of Marlin
  # on SM90, quantization/utils/humming/priority.py:11, and ships in
  # requirements/cuda.txt:31). On SM90 Humming applies SiTU in the launch that
  # prepares the down GEMM's input (fused_moe/experts/fused_humming_moe.py:822-828,
  # writing `quanted_down_input`, quantised only where that GEMM takes a
  # quantised operand) — one launch over the same operands, a different kernel
  # from `situ_and_mul`; without Humming, Marlin calls `torch.ops._C.situ_and_mul`
  # itself (marlin_moe.py:163 → fused_moe/activation.py:372). On SM100 the
  # FlashInfer trtllm-gen kernel applies SiTU inside the expert GEMM; with no
  # whole-expert plan bound that site stays one launch more than vLLM runs.
  situ_and_mul:
    source_anchor: "vllm.model_executor.layers.activation.SituAndMul (vllm/model_executor/layers/activation.py:163, torch.ops._C.situ_and_mul at vllm/model_executor/layers/activation.py:182); routed experts: HummingIndexedExperts.apply (vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py:822-828)"
  silu_and_mul_with_clamp:
    source_anchor: "vllm.model_executor.layers.activation.SiluAndMulWithClamp (vllm/model_executor/layers/activation.py:208, torch.ops._C.silu_and_mul_with_clamp at vllm/model_executor/layers/activation.py:237; DeepseekV4MLP builds it at vllm/models/deepseek_v4/nvidia/model.py:181-182)"
  # The gate+up and q/k/v projections are concatenated along the output dim
  # and run as one GEMM that reads the input once (linear.py:673, :998;
  # `UnquantizedLinearMethod` :165 → model_executor/layers/utils.py:620-632).
  # The short conv in front of every SSM / linear-attention mixer, SiLU
  # folded in (model_executor/layers/mamba/ops/causal_conv1d.py:481 prefill,
  # :1096 decode; Qwen PLE's dilated conv: qwen4_exp/common/ops/ple.py:575).
  causal_conv1d:
    source_anchor: "vllm.model_executor.layers.mamba.ops.causal_conv1d.causal_conv1d_fn (vllm/model_executor/layers/mamba/ops/causal_conv1d.py:481) / causal_conv1d_update (vllm/model_executor/layers/mamba/ops/causal_conv1d.py:1096)"
  # The linear-attention output norm gated by silu/sigmoid(z) in one Triton
  # launch (layers/layernorm.py:404 RMSNormGated.forward_cuda →
  # third_party/flash_linear_attention/ops/layernorm_guard.py:562 rmsnorm_fn,
  # kernel :75).
  rmsnorm_gated:
    source_anchor: "vllm.model_executor.layers.layernorm.RMSNormGated (vllm/model_executor/layers/layernorm.py:289) -> third_party.flash_linear_attention.ops.layernorm_guard.rmsnorm_fn (vllm/third_party/flash_linear_attention/ops/layernorm_guard.py:562)"
  # Gated DeltaNet prefill prep: the split of the conv'd q|k|v into
  # contiguous heads (v copied), the q/k l2norms and both gates, written fp32,
  # in one Triton launch (third_party/flash_linear_attention/ops/
  # fused_gdn_prefill_post_conv.py:152), from `_forward_core`
  # (model_executor/layers/mamba/gdn/qwen_gdn_linear_attn.py:1514) on every
  # batch with prefill tokens. The layer is CUDA-dispatched (`forward_cuda`
  # :982; ROCm aiter runs `_forward_core_rocm` :1279). `crosses: component`:
  # the k and v head views are leaves of the `head_split` component inside
  # the mixer, and the launch writes them.
  fused_gdn_post_conv_prep:
    source_anchor: "vllm.third_party.flash_linear_attention.ops.fused_gdn_prefill_post_conv.fused_post_conv_prep (vllm/third_party/flash_linear_attention/ops/fused_gdn_prefill_post_conv.py:152), from vllm/model_executor/layers/mamba/gdn/qwen_gdn_linear_attn.py:1514"
    crosses: component
    when:
      phase: [prefill]
      device: [cuda]
  # Gated DeltaNet decode: l2norm + gates + recurrence as one launch
  # (third_party/flash_linear_attention/ops/fused_recurrent.py:343, from
  # mamba/gdn/qwen_gdn_linear_attn.py:1766). Prefill is the entry above.
  fused_recurrent_gated_delta_rule:
    source_anchor: "vllm.third_party.flash_linear_attention.ops.fused_recurrent.fused_recurrent_gated_delta_rule_packed_decode (vllm/third_party/flash_linear_attention/ops/fused_recurrent.py:343), from vllm/model_executor/layers/mamba/gdn/qwen_gdn_linear_attn.py:1766"
    when:
      phase: [decode]
  # KDA decode (GLM-5.3-Flash): gate from raw f + dt_bias, beta sigmoid, q/k
  # l2norm and the recurrence in one launch: the `fused_recurrent_kda`
  # wrapper (models/glm5next/nvidia/ops/third_party/kda/kernels.py:148) over
  # `fused_recurrent_gated_delta_rule_fwd_kernel` (fused_recurrent.py:44),
  # from models/glm5next/common/kda.py:760 (compute_gate=True,
  # sigmoid_beta=True, use_qk_l2norm_in_kernel=True). Both Glm5Next classes
  # run it (model_executor/models/registry.py:121, :423). Kimi-K3's decode
  # is the two entries below.
  fused_recurrent_kda:
    source_anchor: "vllm.models.glm5next.nvidia.ops.third_party.kda.kernels.fused_recurrent_kda (vllm/models/glm5next/nvidia/ops/third_party/kda/kernels.py:148) -> fused_recurrent.fused_recurrent_gated_delta_rule_fwd_kernel (vllm/models/glm5next/nvidia/ops/third_party/kda/fused_recurrent.py:44), from vllm/models/glm5next/common/kda.py:760"
    when:
      phase: [decode]
      architectures: [Glm5NextForConditionalGeneration, Glm5NextForCausalLM]
  # Kimi-K3 KDA decode. The whole mixer —
  # three short convs, gate, beta, l2norm, recurrence, gated output norm —
  # is one native launch, `ops.fused_kda_decode`
  # (models/kimi_k3/nvidia/kda.py:1012-1028), in a decode-only batch with no
  # speculative tokens (:985-990, `dims: {n_verify: [1]}` - the walk binds
  # the width of a step that does not speculate as the number 1) when
  # `resolve_kda_decode_backend` picks
  # "native" for the default "auto" (:286-312): local heads 12 / 24 / 48 /
  # 96, head and conv widths 128 / 4, BF16, the binary built, compute
  # capability 9.0 or family 10.x / 12.x (`is_fused_kda_decode_supported`
  # :161-188). `min_compute_capability: "9.0"` states that for every SKU
  # gpu_specs.csv lists (9.0, 10.0, 10.3); an 11.x SKU would need more.
  # Otherwise the gate + beta + l2norm + recurrence span is one launch,
  # `fused_recurrent_kda_packed_decode` (ops/third_party/kda/fused_recurrent
  # .py:582, from kda.py:1338) after the packed conv, with the gated norm
  # apart (:1372); the speculative path's `fused_recurrent_kda` (:1136) has
  # the same span, which is what the per-channel entry below bills.
  # Speculative decode on SM10x is billed on that same default path, not as
  # a whole mixer: vLLM would run FlashInfer's `packed_fused_kda_decode`
  # (:219-244, call :951-982) over the whole span, but only when the
  # installed FlashInfer exposes that API (utils/flashinfer.py:368-373) —
  # a pinned third-party package this repository cannot open, so the
  # boundary is one nothing here can read, and
  # `when:` conditions are conjunctive, so one entry per plan cannot say
  # "no speculation, or SM10x". Billing the span + conv + norm there
  # over-counts launches on an opt-in cell and never claims a fusion the
  # framework does not run (docs/inference_cost_model.md "How precisely to
  # model a dispatch condition").
  fused_kda_decode:
    source_anchor: "vllm._custom_ops.fused_kda_decode (csrc/kimi_k3/fused_kda_decode_kernel.cu), from vllm/models/kimi_k3/nvidia/kda.py:1012"
    when:
      phase: [decode]
      architectures: [KimiK3ForConditionalGeneration]
      device: [cuda]
      min_compute_capability: "9.0"
      activation_dtype: [bf16]
      dims: { n_verify: [1], d_lin_k_head: [128], s_conv_kernel: [4] }
      world_local: { world: tp_attention, dim: n_lin_v_heads, local_in: [12, 24, 48, 96] }
  fused_recurrent_kda_per_channel:
    source_anchor: "vllm.models.kimi_k3.nvidia.ops.third_party.kda.fused_recurrent.fused_recurrent_kda_packed_decode (vllm/models/kimi_k3/nvidia/ops/third_party/kda/fused_recurrent.py:582, kernel vllm/models/kimi_k3/nvidia/ops/third_party/kda/fused_recurrent.py:487), from vllm/models/kimi_k3/nvidia/kda.py:1338"
    when:
      phase: [decode]
      architectures: [KimiK3ForConditionalGeneration]
  # The three KDA short convs as one launch over the packed q|k|v row. Both
  # KDA classes keep one packed filter and state and convolve the merged
  # projection's q|k|v slice in one call, but not in the same phases:
  # GLM-5.3 (Glm5Next) in every phase — speculative `causal_conv1d_update`
  # (models/glm5next/common/kda.py:607-617), prefill `causal_conv1d_fn`
  # (:625-635), plain decode `causal_conv1d_update` (:642-649), over the
  # weight it merges once (:563); Kimi-K3 at decode only — plain
  # (models/kimi_k3/nvidia/kda.py:1325) and speculative (:1084) — while its
  # prefill convolves q, k and v in three calls (:1166-1185), the per-chain
  # `causal_conv1d` entry. Hence two alternatives.
  causal_conv1d_packed:
    source_anchor: "vllm.model_executor.layers.mamba.ops.causal_conv1d.causal_conv1d_update (vllm/model_executor/layers/mamba/ops/causal_conv1d.py:1096) / causal_conv1d_fn (vllm/model_executor/layers/mamba/ops/causal_conv1d.py:481), from vllm/models/glm5next/common/kda.py:607-649 and vllm/models/kimi_k3/nvidia/kda.py:1325 (speculative vllm/models/kimi_k3/nvidia/kda.py:1084)"
    when:
      - architectures: [Glm5NextForConditionalGeneration, Glm5NextForCausalLM]
      - architectures: [KimiK3ForConditionalGeneration]
        phase: [decode]
  # The KDA layer's six input projections as one merged GEMM. GLM-5.3:
  # `in_proj_qkvbfg_a` over q | k | v | b | f_a | g_a, "6→1 launches"
  # (models/glm5next/common/kda.py:236-254), run once (:460), both phases.
  # Kimi-K3: `in_proj_qkvgfab` over q | k | v | g | f_a | b
